<script>
const DOMAINS = {1:"1.0 General Security Concepts",2:"2.0 Threats, Vulnerabilities & Mitigations",3:"3.0 Security Architecture",4:"4.0 Security Operations",5:"5.0 Program Management & Oversight"};
const Q = [...PBQ.bank].sort((a,b)=>a.domain-b.domain);
// Browser storage, namespaced with "sp:" (older un-prefixed keys are migrated on first read).
// Every write also notifies the cloud layer (app/cloud.js), which syncs it when signed in.
const STORE_PREFIX = "sp:";
const store = {
  get(k,d){ try{ let r=localStorage.getItem(STORE_PREFIX+k);
      if(r===null){ const old=localStorage.getItem(k); if(old!==null){ localStorage.setItem(STORE_PREFIX+k,old); localStorage.removeItem(k); r=old; } }
      return r===null ? d : (JSON.parse(r) ?? d); }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(STORE_PREFIX+k,JSON.stringify(v)); }catch(e){} if(window.CLOUD) CLOUD.changed(k,v); }
};
// Daily goal: questions answered per local day (kept 60 days; synced like other progress)
const DAILY = window.DAILY = {
  today(d=new Date()){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); },
  log(){ return store.get("daily-log",{}); },
  goal(){ return +store.get("daily-goal",20) || 20; },
  count(){ return this.log()[this.today()]||0; },
  bump(n=1){ if(!n) return; const l=this.log(), t=this.today(); l[t]=(l[t]||0)+n; const k=Object.keys(l).sort(); while(k.length>60) delete l[k.shift()]; store.set("daily-log",l); if(window.CLOUD&&CLOUD.renderAcct) CLOUD.renderAcct(); },
  streak(){ const l=this.log(), g=this.goal(), d=new Date(); let k=0; if((l[this.today(d)]||0)<g) d.setDate(d.getDate()-1);
    while((l[this.today(d)]||0)>=g){ k++; d.setDate(d.getDate()-1); } return k; }
};
let status = store.get("pbq-status",{});
let cur = 0, timerStart = 0, timerId = null, orderState = [], multiOrder = [];
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle = a => {a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

// ---- Simulated terminal for command-line PBQs ----
// A PBQ may include term: { prompt, intro, cmds: { "cmd|alias|alias": "output", ... } }.
// Matching ignores case and extra spaces. Built-ins: help, clear, history (↑/↓ also recall).
const TERM = (() => {
  const logs = {}, hist = {}, hpos = {};
  const norm = c => c.trim().replace(/\s+/g," ").toLowerCase();
  const table = q => { if(q.__t) return q.__t; const t={}; for(const [k,v] of Object.entries(q.term.cmds)) k.split("|").forEach(a=>t[norm(a)]=v); return q.__t=t; };
  const find = id => Q.find(x=>x.id===id);
  function html(q){
    if(!q.term) return "";
    if(!logs[q.id]) logs[q.id] = [`<span class="t-dim">${esc(q.term.intro||"Type 'help' to list the commands available in this simulation.")}</span>`];
    return `<div class="term" data-term="${esc(q.id)}"><div class="term-out">${logs[q.id].join("\n")}</div>
      <div class="term-in"><span class="t-prompt">${esc(q.term.prompt||"$")}</span><input type="text" spellcheck="false" autocomplete="off" autocapitalize="off" data-term-input="${esc(q.id)}" aria-label="Terminal command"></div></div>`;
  }
  function run(id, raw){
    const q=find(id); if(!q) return; const L=logs[id], c=norm(raw);
    L.push(`<span class="t-prompt">${esc(q.term.prompt||"$")}</span> ${esc(raw)}`);
    if(raw.trim()){ (hist[id]=hist[id]||[]).push(raw); hpos[id]=hist[id].length; }
    if(!c){}
    else if(c==="clear"||c==="cls"){ L.length=0; }
    else if(c==="help"||c==="?"){ L.push(`<span class="t-dim">Commands available in this simulation:</span>\n`+Object.keys(q.term.cmds).map(k=>"  "+esc(k.split("|")[0])).join("\n")); }
    else if(c==="history"){ L.push(esc((hist[id]||[]).map((h,i)=>`${i+1}  ${h}`).join("\n"))); }
    else { const out=table(q)[c]; L.push(out!==undefined ? esc(out) : `<span class="t-err">${esc(raw.trim().split(" ")[0])}: command not found in this simulation. Type 'help' to see what's available.</span>`); }
    const box=document.querySelector(`[data-term="${CSS.escape(id)}"] .term-out`); if(box){ box.innerHTML=L.join("\n"); box.scrollTop=box.scrollHeight; }
  }
  document.addEventListener("keydown", e=>{
    const inp=e.target.closest && e.target.closest("[data-term-input]"); if(!inp) return;
    const id=inp.dataset.termInput, h=hist[id]||[];
    if(e.key==="Enter"){ e.preventDefault(); run(id, inp.value); inp.value=""; }
    else if(e.key==="ArrowUp"&&h.length){ e.preventDefault(); hpos[id]=Math.max(0,(hpos[id]??h.length)-1); inp.value=h[hpos[id]]; }
    else if(e.key==="ArrowDown"&&h.length){ e.preventDefault(); hpos[id]=Math.min(h.length,(hpos[id]??h.length)+1); inp.value=h[hpos[id]]||""; }
  });
  document.addEventListener("click", e=>{ const t=e.target.closest(".term"); if(t && !e.target.closest("input") && !window.getSelection().toString()) t.querySelector("input").focus(); });
  return { html, run };
})();

// Difficulty: questions carry level "easy" | "medium" | "hard" (untagged = medium)
const LEVELS = {easy:"Easy", medium:"Medium", hard:"Hard"};
const lvl = q => q.level || "medium";
let pbqLevel = store.get("pbq-level","all");
const lvlOk = q => pbqLevel==="all" || lvl(q)===pbqLevel;
const visibleIdx = () => Q.map((q,i)=>i).filter(i=>lvlOk(Q[i]));
const lvlChip = q => `<span class="chip lvl-${lvl(q)}">${LEVELS[lvl(q)]}</span>` + (q.custom ? `<span class="chip chip-custom" title="User-created question">Custom · ${esc(q.author||"")}${q.vis&&q.vis!=="public"?" ("+esc(q.vis)+")":""}</span>` : "");

const objChip = q => q.obj && OBJECTIVES[q.obj] ? `<span class="chip obj" title="Exam objective ${q.obj}: ${esc(OBJECTIVES[q.obj])}">${q.obj} ${esc(OBJECTIVES[q.obj])}</span>` : "";
function renderNav(){
  const pass = Q.filter(q=>status[q.id]==="pass").length;
  $("#score").textContent = `${pass} / ${Q.length} passed`;
  const cnt = l => Q.filter(q=>l==="all"||lvl(q)===l).length;
  let html=`<div class="lvlfilter"><label class="muted" for="pbqlevel">Difficulty</label><select id="pbqlevel">${["all","hard","medium","easy"].filter(l=>l==="all"||cnt(l)>0).map(l=>`<option value="${l}" ${pbqLevel===l?"selected":""}>${l==="all"?"All":LEVELS[l]} (${cnt(l)})</option>`).join("")}</select></div>`, last=0;
  Q.forEach((q,i)=>{
    if(!lvlOk(q)) return;
    if(q.domain!==last){ const g=Q.filter(x=>x.domain===q.domain&&lvlOk(x)); html+=`<div class="grp"><span>${esc(DOMAINS[q.domain])}</span><span class="gp">${g.filter(x=>status[x.id]==="pass").length}/${g.length}</span></div>`; last=q.domain; }
    html+=`<button class="${i===cur?"active":""}" data-go="${i}"><span class="num ${status[q.id]||""}">${i+1}</span><span>${esc(q.title)}${lvl(q)==="hard"?' <span class="hardtag">Hard</span>':""}</span></button>`;
  });
  html += `<div class="tools"><button data-act="random">🎲 Random question</button><button data-act="unpassed">➜ Next not yet passed</button><button data-act="resetall">↺ Reset progress</button></div>`;
  $("#nav").innerHTML = html;
}
function go(i){cur=i;render();window.scrollTo(0,0);try{history.replaceState(null,"","#"+Q[i].id)}catch(e){}}
function randomQ(){const v=visibleIdx().filter(i=>i!==cur);if(!v.length)return;go(v[Math.floor(Math.random()*v.length)])}
function nextUnpassed(){for(let k=1;k<=Q.length;k++){const i=(cur+k)%Q.length;if(lvlOk(Q[i])&&status[Q[i].id]!=="pass")return go(i)}}
function nextVisible(){for(let k=1;k<=Q.length;k++){const i=(cur+k)%Q.length;if(lvlOk(Q[i]))return go(i)}}

function cellOpts(q,ri,ci){
  if(q.rowOpts && q.rowOpts[ri]) return q.rowOpts[ri];
  return q.opts[ci];
}

let diagVals = {};
function gridTable(q){
  return `<table><thead><tr><th>Item</th>${q.cols.map(c=>`<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>`+
    q.rows.map((r,ri)=>`<tr><td class="lbl">${esc(r.l)}<div class="why">${esc(r.w||"")}</div></td>`+
      r.a.map((a,ci)=>{
        const opts = cellOpts(q,ri,ci);
        const ctl = !opts
          ? `<input type="text" inputmode="decimal" id="c${ri}_${ci}" placeholder="Enter value">`
          : `<select id="c${ri}_${ci}" required><option value="" disabled selected hidden>Choose…</option>${opts.map(o=>`<option>${esc(o)}</option>`).join("")}</select>`;
        return `<td data-h="${esc(q.cols[ci])}">${ctl}<div class="correct">✓ ${esc(a)}</div></td>`;
      }).join("")+`</tr>`).join("")+`</tbody></table>`;
}
function render(){
  renderNav();
  const q = Q[cur];
  const type = q.type||"grid";
  let body = "";
  if(type==="order"){
    orderState = shuffle(q.items.map((_,i)=>i));
    while(orderState.every((v,i)=>v===i)) orderState = shuffle(orderState);
    body = `<ul class="order" id="order"></ul>`;
  } else if(type==="multi"){
    multiOrder = shuffle(q.choices.map((_,i)=>i));
    body = `<ul class="multi">`+multiOrder.map(i=>{const c=q.choices[i];return `<li id="m${i}"><label><input type="checkbox" value="${i}"><span class="txt">${esc(c.t)}<div class="why">${c.c?"✓ Correct — ":"✗ Not correct — "}${esc(c.w)}</div></span></label></li>`}).join("")+`</ul>`;
  } else if(DIAG.isDiag(q)){
    diagVals = {}; DIAG.reset(q.id);
    body = DIAG.html(q, diagVals) + (q.rows ? `<p class="task" style="margin-top:28px">Follow-up questions</p>`+gridTable(q) : "");
  } else {
    body = gridTable(q);
  }
  $("#main").innerHTML = `
   <div class="mobile-nav"><select id="mnav">${Q.map((x,i)=>lvlOk(x)||i===cur?`<option value="${i}" ${i===cur?"selected":""}>${i+1}. ${esc(x.title)}${lvl(x)==="hard"?" [HARD]":""} ${status[x.id]==="pass"?"✓":status[x.id]==="fail"?"✗":""}</option>`:"").join("")}</select></div>
   <div class="meta"><span class="chip">PBQ ${cur+1} of ${Q.length}</span>${lvlChip(q)}<span class="chip dom">${esc(DOMAINS[q.domain])}</span>${objChip(q)}<span class="chip">Target: ~${q.time||3} min</span></div>
   <h2>${esc(q.title)}</h2>
   <div class="scenario">${q.scenario}${q.log?`<pre class="log">${esc(q.log)}</pre>`:""}</div>${TERM.html(q)}
   <p class="task">${esc(q.task)}</p>
   <div id="work">${body}<div class="explain"><b>Key takeaway:</b> ${esc(q.explain)}</div></div>
   <div class="actions sticky">
     <span class="answered" id="pbqans"></span>
     <button class="btn primary" data-act="check">Check answers</button>
     <button class="btn" data-act="reveal">Show answers</button>
     <button class="btn" data-act="reset">Reset</button>
     <button class="btn" data-act="next">Next →</button>
     <span class="timer" id="timer">0:00</span>
   </div>
   <div class="result" id="result"></div>
   <p class="tip">Exam tip: performance-based questions come first. On the real exam, flag them, finish the multiple choice, then come back. Partial credit is generally believed to apply, so fill in every field.</p>`;
  if(type==="order") drawOrder();
  pbqAnswered(); window.__pbqCounted=false;
  clearInterval(timerId); timerStart=Date.now();
  timerId=setInterval(()=>{const s=Math.floor((Date.now()-timerStart)/1000);const t=$("#timer");if(t){t.textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;t.style.color=s>(q.time||3)*60?"var(--bad)":""}},1000);
}

function pbqAnswered(){
  const el=$("#pbqans"); if(!el) return; const q=Q[cur], t=q.type||"grid";
  if(t==="order"){ el.innerHTML=`<span>${q.items.length} items to order</span>`; return; }
  if(t==="multi"){ const n=document.querySelectorAll("#work .multi input:checked").length; el.innerHTML=`<span>${n} selected</span>`; return; }
  const f=[...document.querySelectorAll("#work table select, #work td input")]; let n=f.filter(x=>x.value!=="").length, tot=f.length;
  if(DIAG.isDiag(q)){ const c=DIAG.count(q, diagVals); n+=c.done; tot+=c.total; }
  el.innerHTML=`<span class="pbar"><b style="width:${tot?Math.round(n/tot*100):0}%"></b></span><span>${n} / ${tot} answered</span>`;
}
document.addEventListener("input",e=>{ if(e.target.closest&&e.target.closest("#work")) pbqAnswered(); });
document.addEventListener("diag:change",()=>{ if(TAB==="pbq") pbqAnswered(); });
document.addEventListener("change",e=>{ if(e.target.closest&&e.target.closest("#work")) pbqAnswered(); });

function drawOrder(marks){
  const q=Q[cur];
  $("#order").innerHTML = orderState.map((idx,pos)=>{
    let fb="";
    if(marks){ fb = `<div class="fb">${marks[pos]?"✓":"Belongs at position "+(idx+1)+"."}${q.labels?" "+esc(q.labels[idx]):""}</div>`; }
    return `<li class="${marks?(marks[pos]?"ok":"bad"):""}"><span class="pos">${pos+1}</span><span class="txt">${esc(q.items[idx])}${fb}</span><span class="mv"><button aria-label="Move up" ${pos===0?"disabled":""} data-mv="${pos},-1">↑</button><button aria-label="Move down" ${pos===orderState.length-1?"disabled":""} data-mv="${pos},1">↓</button></span></li>`;
  }).join("");
}

function grade(){
  const q=Q[cur]; const type=q.type||"grid"; let right=0,total=0;
  if(type==="order"){
    const marks=orderState.map((v,i)=>v===i); right=marks.filter(Boolean).length; total=marks.length; drawOrder(marks);
  } else if(type==="multi"){
    q.choices.forEach((c,i)=>{const li=$("#m"+i);const on=li.querySelector("input").checked;const ok=on===!!c.c;total++;if(ok)right++;li.classList.toggle("ok",ok);li.classList.toggle("bad",!ok)});
  } else {
    if(DIAG.isDiag(q)){ const d=DIAG.score(q, diagVals); right+=d.right; total+=d.total; DIAG.mark(q.id, d.marks); }
    (q.rows||[]).forEach((r,ri)=>r.a.forEach((a,ci)=>{
      const el=$(`#c${ri}_${ci}`); total++;
      let ok;
      if(typeof a==="number"){ const v=parseFloat(el.value.replace(/[$,%\s]/g,"")); ok=!isNaN(v)&&Math.abs(v-a)<=0.001*Math.max(1,Math.abs(a)); }
      else ok = el.value===a;
      el.classList.toggle("ok",ok); el.classList.toggle("bad",!ok); if(ok) right++;
    }));
  }
  return {right,total};
}
function check(){
  const q=Q[cur]; const {right,total}=grade(); const pass=right===total;
  if(!window.__pbqCounted){ window.__pbqCounted=true; DAILY.bump(1); }
  status[q.id]=pass?"pass":"fail"; store.set("pbq-status",status); renderNav();
  window.CLOUD&&CLOUD.log({question_id:q.id, kind:"pbq", domain:q.domain, level:lvl(q), correct:pass, score:total?+(right/total).toFixed(3):0, source:"pbq"});
  const secs=Math.floor((Date.now()-timerStart)/1000);
  const r=$("#result"); r.className="result show "+(pass?"pass":"fail");
  const unit = (q.type==="multi")?"choices judged correctly":"correct";
  r.innerHTML = pass ? `<b>All ${total} ${unit}</b> in ${Math.floor(secs/60)}m ${secs%60}s.` : `<b>${right} / ${total} ${unit}.</b> Fix the red items and check again, or choose “Show answers” to see the explanations.`;
  if(pass){ $("#work").classList.add("reveal"); if(DIAG.isDiag(q)) DIAG.mark(q.id, DIAG.score(q,diagVals).marks, true); }
}
function reveal(){ grade(); $("#work").classList.add("reveal"); const q=Q[cur]; if(DIAG.isDiag(q)) DIAG.mark(q.id, DIAG.score(q,diagVals).marks, true); }

// Event delegation (no inline handlers)
document.addEventListener("click",e=>{
  const g=e.target.closest("[data-go]"); if(g) return go(+g.dataset.go);
  const m=e.target.closest("[data-mv]"); if(m){const [p,d]=m.dataset.mv.split(",").map(Number);const t=p+d;[orderState[p],orderState[t]]=[orderState[t],orderState[p]];return drawOrder();}
  const tb=e.target.closest("[data-tab]"); if(tb) return setTab(tb.dataset.tab);
  const a=e.target.closest("[data-act]"); if(!a) return;
  const fn=({check, reveal, reset:render, next:nextVisible, random:randomQ, unpassed:nextUnpassed,
    resetall:()=>{status={};store.set("pbq-status",status);render()}})[a.dataset.act];
  if(fn) fn();
});
document.addEventListener("change",e=>{
  if(e.target.id==="mnav") go(+e.target.value);
  if(e.target.id==="pbqlevel"){ pbqLevel=e.target.value; store.set("pbq-level",pbqLevel); if(!lvlOk(Q[cur])){ const v=visibleIdx(); if(v.length) return go(v[0]); } renderNav(); }
});

let TAB="pbq";
// Phone navigation: the "Study" button opens a sheet with the remaining sections
function closeStudySheet(){ const s=$("#bsheet"); if(s) s.remove(); const b=document.querySelector("[data-bmore]"); if(b) b.setAttribute("aria-expanded","false"); }
function openStudySheet(){
  if($("#bsheet")) return closeStudySheet();
  const admin = window.CLOUD && CLOUD.isAdmin && CLOUD.isAdmin();
  const item=(t,label,sub)=>`<button role="menuitem" data-tab="${t}" class="${TAB===t?"on":""}"><b>${label}</b><span>${sub}</span></button>`;
  const el=document.createElement("div"); el.id="bsheet"; el.className="bsheet-bg";
  el.innerHTML=`<div class="bsheet" role="menu" aria-label="Study">${item("crash","Crash course","High-yield summaries and exam strategy")}${item("ref","Acronyms & ports","Reference, flashcards and acronym quiz")}${item("mine","My questions","Write and share your own questions")}${admin?item("admin","Admin console","Review queue, users and roles"):""}</div>`;
  document.body.appendChild(el); document.querySelector("[data-bmore]").setAttribute("aria-expanded","true");
  const f=el.querySelector("button"); if(f) f.focus();
}
document.addEventListener("click",e=>{
  if(e.target.closest("[data-bmore]")) return openStudySheet();
  const s=$("#bsheet"); if(s && (e.target===s)) closeStudySheet();
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape" && $("#bsheet")) closeStudySheet(); });
function setTab(t){
  TAB=t; clearInterval(timerId); document.body.dataset.page=t;
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.tab===t));
  document.querySelectorAll(".bn").forEach(b=>b.classList.toggle("on", b.dataset.tab===t || (b.hasAttribute("data-bmore") && ["ref","crash","mine","admin"].includes(t))));
  closeStudySheet();
  document.querySelector(".wrap").classList.toggle("single",t!=="pbq"&&t!=="crash");
  window.TAB_NOW=t;
  if(t==="mcq"){ try{history.replaceState(null,"","#mcq")}catch(e){} MC.home(); }
  else if(t==="exam"){ try{history.replaceState(null,"","#exam")}catch(e){} EX.home(); }
  else if(t==="ref"){ try{history.replaceState(null,"","#ref")}catch(e){} REF.home(); }
  else if(t==="crash"){ CC.home(); }
  else if(t==="mine"){ try{history.replaceState(null,"","#mine")}catch(e){} MINE.home(); }
  else if(t==="account"){ try{history.replaceState(null,"","#progress")}catch(e){} ACCOUNT.home(); }
  else if(t==="admin"){ try{history.replaceState(null,"","#admin")}catch(e){} ADMIN.home(); }
  else { if(!Q.length){ $("#main").innerHTML='<div class="err">No questions loaded.</div>'; return; } go(cur); }
  window.scrollTo(0,0);
}
</script>
<script>
// ---------------- Multiple choice ----------------
const MC = (() => {
  const BANK = PBQ.mc;
  let stats = store.get("mcq-stats", {});      // id -> {s: seen, c: correct, l: last result (1/0)}
  let prefs = Object.assign({doms:[1,2,3,4,5], n:25, mode:"study", pool:"all", levels:["easy","medium","hard"], obj:""}, store.get("mcq-prefs", {}));
  let S = null, tick = null;                  // current session

  const saveStats = () => store.set("mcq-stats", stats);
  const isMulti = q => Array.isArray(q.a);
  const correctSet = q => isMulti(q) ? [...q.a].sort() : [q.a];
  const same = (a,b) => a.length===b.length && [...a].sort().every((v,i)=>v===[...b].sort()[i]);
  const acc = list => { let s=0,c=0; list.forEach(q=>{const t=stats[q.id]; if(t){s+=t.s;c+=t.c}}); return s? c/s : null; };
  const pct = x => x==null ? "—" : Math.round(x*100)+"%";
  const barCls = x => x==null?"":x>=.8?"":x>=.65?"mid":"low";
  const fmt = s => `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;

  function score(){
    const seen = BANK.filter(q=>stats[q.id]).length;
    const a=acc(BANK); $("#score").textContent = seen ? `${seen} / ${BANK.length} seen${a==null?"":" · "+pct(a)}` : "";
  }

  function pool(){
    return BANK.filter(q=>prefs.doms.includes(q.domain) && prefs.levels.includes(lvl(q)) && (!prefs.obj || q.obj===prefs.obj)).filter(q=>{
      const t=stats[q.id];
      if(prefs.pool==="unseen") return !t;
      if(prefs.pool==="missed") return t && t.l===0;
      if(prefs.pool==="weak") return t && t.c/t.s < .7;
      return true;
    });
  }

  function home(){
    clearInterval(tick); score();
    const doms=[1,2,3,4,5].map(d=>{
      const qs=BANK.filter(q=>q.domain===d), a=acc(qs), seen=qs.filter(q=>stats[q.id]).length;
      return `<label class="dom"><input type="checkbox" data-dom="${d}" ${prefs.doms.includes(d)?"checked":""}><span class="nm">${esc(DOMAINS[d])}<div class="muted">${seen} of ${qs.length} seen</div></span><span class="bar"><i class="${barCls(a)}" style="width:${a==null?0:Math.round(a*100)}%"></i></span><span class="stat">${pct(a)} correct</span></label>`;
    }).join("");
    const r=(name,val,label)=>`<label><input type="radio" name="${name}" value="${val}" ${String(prefs[name])===String(val)?"checked":""}> ${label}</label>`;
    $("#main").innerHTML = `
      <h2>Multiple-choice practice</h2>
      <p class="muted">${BANK.length} questions in the bank. Your accuracy is tracked per question in this browser, so “missed” and “weak” pools always target what you need most.</p>
      <div class="card"><h3>Domains</h3><div class="doms">${doms}</div></div>
      <div class="card"><h3>Exam objective</h3><div class="row" style="align-items:center"><select id="mcobj" style="max-width:520px"><option value="">All objectives</option>${[1,2,3,4,5].map(d=>`<optgroup label="${esc(DOMAINS[d])}">${Object.keys(OBJECTIVES).filter(k=>+k[0]===d).map(k=>{const qs=BANK.filter(q=>q.obj===k);return `<option value="${k}" ${prefs.obj===k?"selected":""}>${k} ${esc(OBJECTIVES[k])} (${qs.length} · ${pct(acc(qs))})</option>`}).join("")}</optgroup>`).join("")}</select>${prefs.obj?`<span class="chip obj">Drilling ${prefs.obj} only</span>`:""}</div></div>
      <div class="card"><h3>Difficulty</h3><div class="levels">
        ${["hard","medium","easy"].filter(l=>BANK.some(q=>lvl(q)===l)).map(l=>{const qs=BANK.filter(q=>lvl(q)===l);const a=acc(qs);return `<label><input type="checkbox" data-lvl="${l}" ${prefs.levels.includes(l)?"checked":""}> <span class="chip lvl-${l}">${LEVELS[l]}</span> <span class="muted">${qs.length} questions · ${pct(a)} correct</span></label>`}).join("")}
        <button class="btn" data-mc="hardonly" style="padding:5px 12px;margin-left:auto">Hard only — cram mode</button>
      </div></div>
      <div class="card"><h3>Mode</h3><div class="row">
        ${r("mode","study","<b>Study</b> — explanation after every question")}
        ${r("mode","exam","<b>Exam sim</b> — timed (1 min/question), results at the end")}
      </div></div>
      <div class="card"><h3>Question pool</h3><div class="row">
        ${r("pool","all","All")}${r("pool","unseen","Not seen yet")}${r("pool","missed","Missed last time")}${r("pool","weak","Below 70%")}
      </div></div>
      <div class="card"><h3>Number of questions</h3><div class="row">
        ${[10,25,50,90,9999].map(n=>r("n",n,n===9999?"All":n)).join("")}
      </div></div>
      <div class="actions"><button class="btn primary" data-mc="start">Start</button><span class="muted" id="poolinfo"></span>
        <button class="btn" data-mc="resetstats" style="margin-left:auto">Reset multiple-choice stats</button></div>`;
    info();
  }
  function info(){ const p=pool(); const el=$("#poolinfo"); if(el) el.textContent = `${p.length} question${p.length===1?"":"s"} match these settings.`; }

  function start(qs){
    qs = qs || shuffle(pool()).slice(0, prefs.n);
    if(!qs.length){ $("#poolinfo").textContent="No questions match — choose more domains or a different pool."; return; }
    S = { mode: prefs.mode, i: 0, start: Date.now(), limit: qs.length*60,
          items: qs.map(q=>({q, order: shuffle(q.o.map((_,k)=>k)), sel: [], done:false, flag:false})) };
    if(S.mode==="exam"){ clearInterval(tick); tick=setInterval(()=>{ const left=S.limit-Math.floor((Date.now()-S.start)/1000); const t=$("#mctimer"); if(t){t.textContent=fmt(Math.max(0,left)); t.className="timer"+(left<120?" crit":left<300?" warn":"");} if(left<=0) finish(); },1000); }
    show();
  }

  function show(){
    const it=S.items[S.i], q=it.q, multi=isMulti(q), need=multi?q.a.length:1;
    const reveal = S.mode==="study" && it.done;
    const cs = correctSet(q);
    const opts = it.order.map(k=>{
      let cls=""; if(reveal){ if(cs.includes(k)) cls="ok"; else if(it.sel.includes(k)) cls="bad"; }
      return `<li><label class="opt ${cls}"><input type="${multi?"checkbox":"radio"}" name="mcopt" value="${k}" ${it.sel.includes(k)?"checked":""} ${reveal?"disabled":""}><span>${esc(q.o[k])}</span></label></li>`;
    }).join("");
    const right = it.done && same(it.sel, cs);
    const letter = k => String.fromCharCode(65+it.order.indexOf(k));
    const fb = reveal ? `<div class="feedback ${right?"pass":"fail"}" role="status"><p class="verdict">${right?"✓ Correct":`✕ Not quite — the answer ${multi?"is":"is"} ${cs.map(letter).join(" + ")}`}</p>
      <div class="fb-body"><div class="overline">Explanation</div><p><b>${multi?"Answers":"Answer"}:</b> ${cs.map(k=>`${letter(k)}. ${esc(q.o[k])}`).join(" · ")}</p><p>${esc(q.e)}</p>${whyOthers(q,it,cs,right)}
      <div class="fb-foot"><button class="linkbtn" data-ccreview="${q.domain}">Review ${esc(DOMAINS[q.domain].replace(/^\d\.0 /,""))} in the Crash course →</button></div></div></div>` : "";
    let btns;
    if(S.mode==="study") btns = it.done
      ? `<button class="btn primary" data-mc="next">${S.i===S.items.length-1?"See results":"Next question →"}</button>`
      : `<button class="btn primary" data-mc="submit" ${it.sel.length?"":"disabled"}>Submit</button><button class="btn" data-mc="skip">Skip</button>`;
    else btns = `<button class="btn" data-mc="prev" ${S.i===0?"disabled":""}>← Previous</button><button class="btn ${it.flag?"flag-on":""}" data-mc="flag">${it.flag?"⚑ Flagged":"⚐ Flag for review"}</button><button class="btn primary" data-mc="next">${S.i===S.items.length-1?"Review & finish":"Next →"}</button>`;
    const gridNav = S.mode==="exam" ? `<div class="grid-nav">${S.items.map((x,k)=>`<button data-mcjump="${k}" class="${x.sel.length?"ans":""} ${k===S.i?"cur":""} ${x.flag?"fl":""}">${k+1}</button>`).join("")}</div>` : "";
    const nOk=S.items.filter(x=>x.done&&same(x.sel,correctSet(x.q))).length, nBad=S.items.filter(x=>x.done&&!same(x.sel,correctSet(x.q))).length;
    const segCls=(x,k)=>k===S.i?"cur":S.mode==="exam"?(x.sel.length?"ans":""):x.done?(same(x.sel,correctSet(x.q))?"ok":"bad"):k<S.i?"skip":"";
    const segs = S.items.length<=60 ? `<div class="segs" aria-hidden="true">${S.items.map((x,k)=>`<i class="${segCls(x,k)}"></i>`).join("")}</div>`
      : `<div class="segs cont" aria-hidden="true"><b style="width:${Math.round((S.i+1)/S.items.length*100)}%"></b></div>`;
    const sess = `<div class="sessbar">${segs}<div class="sessmeta"><span>${S.i+1} of ${S.items.length}</span>${S.mode==="study"?`<span><span class="dot dot-ok"></span>${nOk} correct<span class="dot-bad"></span>${nBad} missed</span>`:`<span>${S.items.filter(x=>x.sel.length).length} answered${S.items.some(x=>x.flag)?` · ${S.items.filter(x=>x.flag).length} flagged`:""}</span>`}</div></div>`;
    const keys = `<span class="keys"><span><kbd>A</kbd>–<kbd>${String.fromCharCode(64+Math.min(it.order.length,9))}</kbd> choose</span>${S.mode==="study"?`<span><kbd>Enter</kbd> ${it.done?"next":"submit"}</span>`:`<span><kbd>←</kbd><kbd>→</kbd> move</span><span><kbd>F</kbd> flag</span>`}</span>`;
    $("#main").innerHTML = `${sess}
      <div class="meta"><span class="chip">Question ${S.i+1} of ${S.items.length}</span>${lvlChip(q)}<span class="chip dom">${esc(DOMAINS[q.domain])}</span>${objChip(q)}${S.mode==="exam"?`<span class="chip">Time left <b id="mctimer" class="timer">${fmt(Math.max(0,S.limit-Math.floor((Date.now()-S.start)/1000)))}</b></span>`:""}${it.flag?'<span class="chip flagged">Flagged</span>':""}</div>
      <p class="qtext">${esc(q.q)}${multi&&!/choose/i.test(q.q)?` <span class="muted">(Choose ${["","one","two","three","four"][need]||need}.)</span>`:""}</p>
      <ul class="opts">${opts}</ul>${fb}
      <div class="actions">${btns}<button class="btn" data-mc="quit" style="margin-left:auto">${S.mode==="exam"?"Finish now":"End session"}</button></div>${gridNav}
      <p class="tip">${S.mode==="study"?"Tip: read the explanation even when you get it right — it often covers why the other options are wrong.":"Exam sim: no feedback until the end, just like the real test. Flag anything you want to revisit."}${keys}</p>`;
    window.scrollTo(0,0);
  }

  // Optional data: q.w = ["why option 0 is wrong", ...] (same order as q.o). Hidden when a question has none.
  function whyOthers(q,it,cs,right){
    if(!Array.isArray(q.w)) return "";
    const rows=it.order.filter(k=>!cs.includes(k)&&q.w[k]).map(k=>`<li><b>${String.fromCharCode(65+it.order.indexOf(k))}. ${esc(q.o[k])}</b> — ${esc(q.w[k])}</li>`);
    return rows.length?`<details class="whyopts" ${right?"":"open"}><summary>Why the other options are wrong</summary><ul>${rows.join("")}</ul></details>`:"";
  }
  function review(){
    const qs=shuffle(BANK.filter(q=>stats[q.id]&&stats[q.id].l===0)).slice(0,50);
    if(!qs.length) return false; prefs.mode="study"; start(qs); return true;
  }
  function readSel(){ const it=S.items[S.i]; it.sel=[...document.querySelectorAll('input[name=mcopt]:checked')].map(x=>+x.value); }
  function record(it){ DAILY.bump(it.sel.length?1:0); const ok=same(it.sel,correctSet(it.q)); const t=stats[it.q.id]||{s:0,c:0,l:0}; t.s++; if(ok)t.c++; t.l=ok?1:0; stats[it.q.id]=t;
    window.CLOUD&&CLOUD.log({question_id:it.q.id, kind:"mc", domain:it.q.domain, level:lvl(it.q), correct:ok, score:ok?1:0, source:S.mode==="exam"?"exam":"study"}); return ok; }

  function finish(){
    clearInterval(tick);
    if(S.mode==="exam"){ readSel(); S.items.forEach(it=>{ it.done=true; record(it); }); saveStats(); }
    const done=S.items.filter(it=>it.done), right=done.filter(it=>same(it.sel,correctSet(it.q)));
    const p = done.length? right.length/done.length : 0;
    const secs=Math.floor((Date.now()-S.start)/1000);
    const byDom=[1,2,3,4,5].map(d=>{const xs=done.filter(it=>it.q.domain===d); if(!xs.length) return ""; const r=xs.filter(it=>same(it.sel,correctSet(it.q))).length; return `<div class="dom" style="cursor:default"><span class="nm">${esc(DOMAINS[d])}</span><span class="bar"><i class="${barCls(r/xs.length)}" style="width:${Math.round(r/xs.length*100)}%"></i></span><span class="stat">${r} / ${xs.length}</span></div>`}).join("");
    const wrong=done.filter(it=>!same(it.sel,correctSet(it.q)));
    const list=(S.mode==="exam"?done:wrong).map((it,k)=>{const q=it.q,cs=correctSet(q),ok=same(it.sel,cs);return `<div class="review"><div class="muted">${esc(DOMAINS[q.domain])}</div><b>${esc(q.q)}</b>
      <div class="yours" style="color:${ok?"var(--ok)":"var(--bad)"}">${ok?"✓":"✗"} Your answer: ${it.sel.length?it.sel.map(x=>esc(q.o[x])).join(" + "):"(blank)"}</div>
      ${ok?"":`<div class="yours" style="color:var(--ok)">Correct: ${cs.map(x=>esc(q.o[x])).join(" + ")}</div>`}<p class="muted" style="margin:6px 0 0">${esc(q.e)}</p></div>`}).join("");
    $("#main").innerHTML = `
      <h2>Results</h2>
      <div class="card"><p class="big" style="color:${p>=.83?"var(--ok)":"var(--bad)"}">${Math.round(p*100)}%</p>
      <p class="muted">${right.length} of ${done.length} correct · ${fmt(secs)} elapsed. Aim for 85%+ on practice sets; the real exam's passing score is 750 on a 100–900 scale.</p></div>
      <div class="card"><h3>By domain</h3><div class="doms">${byDom||'<span class="muted">No questions answered.</span>'}</div></div>
      <div class="actions">${wrong.length?`<button class="btn primary" data-mc="retrymissed">Retry the ${wrong.length} missed</button>`:""}<button class="btn" data-mc="home">New session</button></div>
      <div class="card"><h3>${S.mode==="exam"?"Full review":"Questions to review"}</h3>${list||'<p class="muted">Nothing missed. Nice work.</p>'}</div>`;
    S.wrong = wrong.map(it=>it.q); score(); window.scrollTo(0,0);
  }

  document.addEventListener("click", e=>{
    const j=e.target.closest("[data-mcjump]"); if(j&&S){ readSel(); S.i=+j.dataset.mcjump; return show(); }
    const b=e.target.closest("[data-mc]"); if(!b) return;
    const act=b.dataset.mc;
    if(act==="start") return start();
    if(act==="home") return home();
    if(act==="resetstats"){ stats={}; saveStats(); return home(); }
    if(act==="hardonly"){ prefs.levels=["hard"]; store.set("mcq-prefs",prefs); return home(); }
    if(act==="retrymissed"){ const m=S.wrong; prefs.mode="study"; return start(shuffle(m)); }
    if(!S) return;
    const it=S.items[S.i];
    if(act==="submit"){ readSel(); if(!it.sel.length) return; it.done=true; record(it); saveStats(); score(); return show(); }
    if(act==="skip"||act==="next"){ if(S.mode==="exam") readSel(); if(S.i<S.items.length-1){S.i++; return show();} return finish(); }
    if(act==="prev"){ readSel(); S.i=Math.max(0,S.i-1); return show(); }
    if(act==="flag"){ readSel(); it.flag=!it.flag; return show(); }
    if(act==="quit") return finish();
  });
  document.addEventListener("change", e=>{
    const t=e.target;
    if(t.name==="mcopt"){ const sb=document.querySelector("[data-mc=submit]"); if(sb) sb.disabled=!document.querySelector("input[name=mcopt]:checked"); return; }
    if(t.dataset && t.dataset.dom){ const d=+t.dataset.dom; prefs.doms = t.checked ? [...new Set([...prefs.doms,d])] : prefs.doms.filter(x=>x!==d); }
    else if(t.dataset && t.dataset.lvl){ const l=t.dataset.lvl; prefs.levels = t.checked ? [...new Set([...prefs.levels,l])] : prefs.levels.filter(x=>x!==l); }
    else if(["mode","pool","n"].includes(t.name)){ prefs[t.name] = t.name==="n" ? +t.value : t.value; }
    else if(t.id==="mcobj"){ prefs.obj=t.value; if(prefs.obj){ const d=+prefs.obj[0]; if(!prefs.doms.includes(d)) prefs.doms=[...prefs.doms,d]; } store.set("mcq-prefs",prefs); return home(); }
    else return;
    store.set("mcq-prefs",prefs); info();
  });
  document.addEventListener("keydown", e=>{
    if(!S || TAB!=="mcq" || e.ctrlKey || e.metaKey || e.altKey || !document.querySelector("input[name=mcopt]")) return;
    const tg=e.target; if(tg.matches && tg.matches("input[type=text],input[type=search],textarea,select")) return;
    const it=S.items[S.i], k=e.key.toLowerCase();
    let n=-1; if(/^[1-9]$/.test(k)) n=+k-1; else if(/^[a-i]$/.test(k) && !(k==="f"&&S.mode==="exam")) n=k.charCodeAt(0)-97;
    if(n>=0 && n<it.order.length){ const inp=document.querySelectorAll("input[name=mcopt]")[n]; if(inp && !inp.disabled){ e.preventDefault(); if(inp.type==="checkbox") inp.checked=!inp.checked; else inp.checked=true; inp.dispatchEvent(new Event("change",{bubbles:true})); inp.focus({preventScroll:true}); } return; }
    if(tg.closest && tg.closest("button")) return;   // Enter on a focused button already clicks it
    const click=sel=>{ const b=document.querySelector(sel); if(b && !b.disabled){ e.preventDefault(); b.click(); } };
    if(k==="enter") return click(it.done||S.mode==="exam" ? "[data-mc=next]" : "[data-mc=submit]");
    if(S.mode==="exam"){ if(k==="f") return click("[data-mc=flag]"); if(k==="arrowright") return click("[data-mc=next]"); if(k==="arrowleft") return click("[data-mc=prev]"); }
  });
  // Lets the practice exam record results into the same per-question stats
  function rec(q, ok, counted=true){ DAILY.bump(counted?1:0); const t=stats[q.id]||{s:0,c:0,l:0}; t.s++; if(ok)t.c++; t.l=ok?1:0; stats[q.id]=t; saveStats();
    window.CLOUD&&CLOUD.log({question_id:q.id, kind:"mc", domain:q.domain, level:lvl(q), correct:ok, score:ok?1:0, source:"exam"}); }
  function preset(o){ Object.assign(prefs, {obj:""}, o); store.set("mcq-prefs", prefs); }
  return { home, rec, same, correctSet, preset, review, missed:()=>BANK.filter(q=>stats[q.id]&&stats[q.id].l===0).length };
})();
</script>
<script>
// ---------------- Practice exam (PBQ + MC, domain-weighted, timed) ----------------
const EX = (() => {
  const W = {1:.12, 2:.22, 3:.18, 4:.28, 5:.20};            // SY0-701 domain weights
  const LEN = { full:{p:4, m:86, min:90, label:"Full exam — 90 questions, 90 minutes"},
                half:{p:2, m:43, min:45, label:"Half exam — 45 questions, 45 minutes"} };
  const PBQ_POINTS = 3;                                      // PBQs weigh more than MC; partial credit
  const PASS = 750;
  let hist = store.get("exam-history", []);
  let X = null, tick = null, len = store.get("exam-len","full"), xlvl = store.get("exam-level","all");
  // In hard mode, hard questions are drawn first and the rest is topped up from the remaining pool.
  const ordered = list => xlvl==="hard" ? [...shuffle(list.filter(q=>lvl(q)==="hard")), ...shuffle(list.filter(q=>lvl(q)!=="hard"))] : shuffle(list);
  const fmt = s => `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
  const pctS = x => Math.round(x*100)+"%";
  const barCls = x => x>=.8?"":x>=.65?"mid":"low";
  const scaled = p => Math.round(100 + 800*p);
  const timerCls = left => "timer big"+(left<120?" crit":left<600?" warn":"");

  function alloc(n){
    const r=[1,2,3,4,5].map(d=>({d, n:Math.floor(n*W[d]), f:n*W[d]-Math.floor(n*W[d])}));
    let left=n-r.reduce((s,x)=>s+x.n,0);
    [...r].sort((a,b)=>b.f-a.f).forEach(x=>{ if(left>0){x.n++;left--;} });
    return Object.fromEntries(r.map(x=>[x.d,x.n]));
  }
  function newP(q){
    const t=q.type||"grid", it={kind:"pbq", q, t, flag:false, touched:false};
    if(t==="grid"||t==="build"||t==="topo") it.vals={};
    if(t==="order"){ let o=shuffle(q.items.map((_,i)=>i)); while(o.every((v,i)=>v===i)) o=shuffle(o); it.order=o; }
    if(t==="multi"){ it.mo=shuffle(q.choices.map((_,i)=>i)); it.checked=[]; }
    return it;
  }
  function build(){
    const L=LEN[len], per=alloc(L.m); let mcs=[], short=0;
    for(const d of [1,2,3,4,5]){ const p=ordered(PBQ.mc.filter(q=>q.domain===d)); mcs.push(...p.slice(0,per[d])); short+=Math.max(0,per[d]-p.length); }
    if(short) mcs.push(...ordered(PBQ.mc.filter(q=>!mcs.includes(q))).slice(0,short));
    const ps=ordered(Q), pick=[], used=new Set();
    for(const q of ps) if(pick.length<L.p && !used.has(q.domain)){ pick.push(q); used.add(q.domain); }
    for(const q of ps) if(pick.length<L.p && !pick.includes(q)) pick.push(q);
    return { items:[...pick.map(newP), ...shuffle(mcs).map(q=>({kind:"mc", q, order:shuffle(q.o.map((_,k)=>k)), sel:[], flag:false}))],
             i:0, start:Date.now(), limit:L.min*60, confirm:false, len };
  }
  const answered = it => it.kind==="mc" ? it.sel.length>0 :
    (it.t==="grid"||it.t==="build"||it.t==="topo") ? Object.values(it.vals).some(v=>v!=="") : it.t==="order" ? it.touched : it.checked.length>0;

  // ---------- home ----------
  function home(){
    if(X) return show();               // resume an exam in progress after switching tabs
    clearInterval(tick); document.body.classList.remove("exam-live");
    $("#score").textContent = hist.length ? `${hist.length} exam${hist.length>1?"s":""} taken · best ${Math.max(...hist.map(h=>h.score))}` : "No practice exams yet";
    const avg = d => { const xs=hist.filter(h=>h.dom[d]!=null).slice(-5); return xs.length? xs.reduce((s,h)=>s+h.dom[d],0)/xs.length : null; };
    const domRows=[1,2,3,4,5].map(d=>{const a=avg(d);return `<div class="dom" style="cursor:default"><span class="nm">${esc(DOMAINS[d])} <span class="muted">· ${Math.round(W[d]*100)}% of exam</span></span><span class="bar"><i class="${a==null?"":barCls(a)}" style="width:${a==null?0:Math.round(a*100)}%"></i></span><span class="stat">${a==null?"—":pctS(a)}</span></div>`}).join("");
    const rows=hist.slice().reverse().slice(0,15).map(h=>`<tr><td>${new Date(h.d).toLocaleString([], {month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})}</td><td>${h.len==="half"?"Half":"Full"}</td><td><b style="color:${h.score>=PASS?"var(--ok)":"var(--bad)"}">${h.score}</b></td><td>${pctS(h.pct)}</td><td>${fmt(h.secs)}</td></tr>`).join("");
    const r=(v)=>`<label><input type="radio" name="exlen" value="${v}" ${len===v?"checked":""}> ${LEN[v].label}</label>`;
    $("#main").innerHTML = `
      <h2>Practice exam</h2>
      <p class="muted">Every exam is assembled at random from the bank: performance-based questions first (like the real test), then multiple choice weighted to the official SY0-701 domain percentages. ${Q.length} PBQs and ${PBQ.mc.length} multiple-choice questions are in the pool.</p>
      <div class="card"><h3>Length</h3><div class="row" style="flex-direction:column;gap:8px">${r("full")}${r("half")}</div></div>
      <div class="card"><h3>Difficulty</h3><div class="row" style="flex-direction:column;gap:8px">
        <label><input type="radio" name="exlvl" value="all" ${xlvl==="all"?"checked":""}> Realistic mix — drawn from the whole bank</label>
        <label><input type="radio" name="exlvl" value="hard" ${xlvl==="hard"?"checked":""}> <span class="chip lvl-hard">Hard-weighted</span> — every hard question available in each domain first, topped up with the rest (${PBQ.mc.filter(q=>lvl(q)==="hard").length} hard MC, ${Q.filter(q=>lvl(q)==="hard").length} hard PBQs)</label>
      </div></div>
      <div class="card"><h3>How it's scored</h3><p class="muted" style="margin:0">Multiple choice = 1 point. PBQs = ${PBQ_POINTS} points each with partial credit. Your percentage is converted to an <b>estimated</b> 100–900 scale (pass mark 750). CompTIA doesn't publish its scoring formula, so treat the scaled score as a guide — consistently scoring 800+ here is a good sign.</p></div>
      <div class="actions"><button class="btn primary" data-ex="start">Start exam</button>${hist.length?'<button class="btn" data-ex="clearhist" style="margin-left:auto">Clear exam history</button>':""}</div>
      ${hist.length?`<div class="card"><h3>Domain average (last 5 exams)</h3><div class="doms">${domRows}</div></div>
      <div class="card"><h3>Attempt history</h3><table><thead><tr><th>Date</th><th>Length</th><th>Score</th><th>%</th><th>Time</th></tr></thead><tbody>${rows}</tbody></table></div>`:""}`;
  }

  // ---------- exam ----------
  function start(){
    X=build(); clearInterval(tick);
    tick=setInterval(()=>{ const left=X.limit-Math.floor((Date.now()-X.start)/1000); const t=$("#extimer"); if(t){t.textContent=fmt(Math.max(0,left)); t.className=timerCls(left);} if(left<=0 && TAB==="exam"){ readDOM(); finish(); } },1000);
    show();
  }
  function exTable(q,it){
    return `<table><thead><tr><th>Item</th>${q.cols.map(c=>`<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>`+q.rows.map((r,ri)=>`<tr><td class="lbl">${esc(r.l)}</td>`+r.a.map((a,ci)=>{const o=cellOpts(q,ri,ci),v=it.vals[ri+"_"+ci]||"";return `<td data-h="${esc(q.cols[ci])}">${!o?`<input type="text" inputmode="decimal" data-x="${ri}_${ci}" value="${esc(v)}" placeholder="Enter value">`:`<select data-x="${ri}_${ci}" required><option value="" disabled ${v?"":"selected"} hidden>Choose…</option>${o.map(x=>`<option ${x===v?"selected":""}>${esc(x)}</option>`).join("")}</select>`}</td>`}).join("")+`</tr>`).join("")+`</tbody></table>`;
  }
  function bodyFor(it){
    const q=it.q;
    if(it.kind==="mc"){
      const multi=Array.isArray(q.a);
      return `<p class="qtext">${esc(q.q)}</p><ul class="opts">${it.order.map(k=>`<li><label class="opt"><input type="${multi?"checkbox":"radio"}" name="xopt" value="${k}" ${it.sel.includes(k)?"checked":""}><span>${esc(q.o[k])}</span></label></li>`).join("")}</ul>`;
    }
    let b="";
    if(it.t==="grid"){
      b=exTable(q,it);
    } else if(it.t==="build"||it.t==="topo"){
      b=DIAG.html(q, it.vals)+(q.rows?`<p class="task" style="margin-top:28px">Follow-up questions</p>`+exTable(q,it):"");
    } else if(it.t==="order"){
      b=`<ul class="order">${it.order.map((idx,pos)=>`<li><span class="pos">${pos+1}</span><span class="txt">${esc(q.items[idx])}</span><span class="mv"><button ${pos===0?"disabled":""} data-xmv="${pos},-1">↑</button><button ${pos===it.order.length-1?"disabled":""} data-xmv="${pos},1">↓</button></span></li>`).join("")}</ul>`;
    } else {
      b=`<ul class="multi">${it.mo.map(i=>`<li><label><input type="checkbox" name="xmulti" value="${i}" ${it.checked.includes(i)?"checked":""}><span class="txt">${esc(q.choices[i].t)}</span></label></li>`).join("")}</ul>`;
    }
    return `<h2 style="font-size:22px;line-height:32px">${esc(q.title)}</h2><div class="scenario">${q.scenario}${q.log?`<pre class="log">${esc(q.log)}</pre>`:""}</div>${TERM.html(q)}<p class="task">${esc(q.task)}</p>${b}`;
  }
  function show(){
    if(X.limit-Math.floor((Date.now()-X.start)/1000)<=0) return finish();
    document.body.classList.add("exam-live");
    const it=X.items[X.i], n=X.items.length, left=X.limit-Math.floor((Date.now()-X.start)/1000);
    const unanswered=X.items.filter(x=>!answered(x)).length, flagged=X.items.filter(x=>x.flag).length;
    $("#score").textContent=`Practice exam in progress · ${n-unanswered}/${n} answered`;
    const done=n-unanswered;
    const grid=`<div class="grid-nav">${X.items.map((x,k)=>`<button data-exjump="${k}" title="${x.kind==="pbq"?"Performance-based":"Multiple choice"} ${k+1}${answered(x)?" · answered":""}${x.flag?" · flagged":""}" class="${answered(x)?"ans":""} ${k===X.i?"cur":""} ${x.flag?"fl":""}">${x.kind==="pbq"?"P"+(k+1):k+1}</button>`).join("")}</div>
      <div class="legend"><span><i class="l-ans"></i>Answered</span><span><i></i>Unanswered</span><span><i class="l-fl"></i>Flagged</span><span><i class="l-cur"></i>Current</span></div>`;
    $("#main").innerHTML = `
      <div class="exbar"><span class="${timerCls(left)}" id="extimer" aria-label="Time left">${fmt(Math.max(0,left))}</span>
        <span class="xprog"><span class="pbar"><b style="width:${Math.round(done/n*100)}%"></b></span><span id="xans">${done} of ${n} answered</span></span>
        ${flagged?`<span class="xflag">⚑ ${flagged} flagged</span>`:""}
        <button class="btn" data-ex="finish">Finish exam</button></div>
      <div class="exlayout"><div class="exmain">
      <div class="meta"><span class="chip">Question ${X.i+1} of ${n}</span><span class="chip">${it.kind==="pbq"?"Performance-based":"Multiple choice"}</span><span class="chip dom">${esc(DOMAINS[it.q.domain])}</span>${it.flag?'<span class="chip flagged">⚑ Flagged</span>':""}</div>
      ${bodyFor(it)}
      <div class="actions"><button class="btn" data-ex="prev" ${X.i===0?"disabled":""}>← Previous</button><button class="btn ${it.flag?"flag-on":""}" data-ex="flag">${it.flag?"⚑ Flagged":"⚐ Flag"}</button><button class="btn primary" data-ex="next" style="margin-left:auto">${X.i===n-1?"Review & finish":"Next →"}</button></div>
      <p class="tip">Strategy: PBQs are first. If one is eating your time, flag it, move on, and come back after the multiple choice. Answer everything — there's no penalty for guessing.<span class="keys"><span><kbd>A</kbd>–<kbd>D</kbd> choose</span><span><kbd>←</kbd><kbd>→</kbd> move</span><span><kbd>F</kbd> flag</span></span></p>
      </div>
      <aside class="expanel ${X.grid?"open":""}"><div class="ph"><span class="overline">Review grid</span><button class="btn sm" data-ex="gridtoggle">${X.grid?"Hide":"Show"} grid</button></div><div class="grid-body">${grid}</div></aside>
      </div>
      ${X.confirm?`<div class="modal-bg" data-ex="cancel-bg"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="xfin"><h3 id="xfin">Finish and score this exam?</h3>
        <div class="xstats"><div><b>${done}</b><span>Answered</span></div><div class="xu"><b>${unanswered}</b><span>Unanswered</span></div><div class="xf"><b>${flagged}</b><span>Flagged</span></div></div>
        <p class="muted" style="margin:0">Unanswered questions are scored as wrong — there's no penalty for guessing.</p>
        <div class="mrow" style="margin-top:20px"><button class="btn" data-ex="cancel">Keep working</button><button class="btn primary" data-ex="confirm">Finish and score</button></div></div></div>`:""}`;
    window.scrollTo(0,0);
  }
  function readDOM(){
    if(!X || TAB!=="exam" || !document.querySelector("[data-ex=flag]")) return; const it=X.items[X.i];
    if(it.kind==="mc") it.sel=[...document.querySelectorAll("input[name=xopt]:checked")].map(x=>+x.value);
    else if(it.t==="grid"||it.t==="build"||it.t==="topo") document.querySelectorAll("[data-x]").forEach(el=>it.vals[el.dataset.x]=el.value);
    else if(it.t==="multi") it.checked=[...document.querySelectorAll("input[name=xmulti]:checked")].map(x=>+x.value);
  }

  // ---------- grading ----------
  function gradeItem(it){
    const q=it.q;
    if(it.kind==="mc"){ const ok=MC.same(it.sel, MC.correctSet(q)); return {e:ok?1:0, p:1, ok}; }
    let frac=0;
    if(it.t==="grid"||it.t==="build"||it.t==="topo"){ let t=0,c=0; if(DIAG.isDiag(q)){ const d=DIAG.score(q,it.vals); t+=d.total; c+=d.right; } (q.rows||[]).forEach((r,ri)=>r.a.forEach((a,ci)=>{ t++; const v=it.vals[ri+"_"+ci]||""; if(typeof a==="number"){ const n=parseFloat(String(v).replace(/[$,%\s]/g,"")); if(!isNaN(n)&&Math.abs(n-a)<=0.001*Math.max(1,Math.abs(a))) c++; } else if(v===a) c++; })); frac=c/t; }
    else if(it.t==="order"){ frac = it.touched ? it.order.filter((v,i)=>v===i).length/it.order.length : 0; }
    else { const good=q.choices.map((c,i)=>c.c?i:-1).filter(i=>i>=0); const hit=it.checked.filter(i=>good.includes(i)).length, miss=it.checked.filter(i=>!good.includes(i)).length; frac=Math.max(0,(hit-miss)/good.length); }
    return {e:PBQ_POINTS*frac, p:PBQ_POINTS, ok:frac===1, frac};
  }
  function finish(){
    clearInterval(tick); document.body.classList.remove("exam-live");
    const secs=Math.min(X.limit, Math.floor((Date.now()-X.start)/1000));
    const g=X.items.map(gradeItem); let E=0,P=0; const dom={};
    X.items.forEach((it,k)=>{ E+=g[k].e; P+=g[k].p; const d=it.q.domain; dom[d]=dom[d]||{e:0,p:0}; dom[d].e+=g[k].e; dom[d].p+=g[k].p;
      if(it.kind==="mc") MC.rec(it.q, g[k].ok, answered(it)); else { DAILY.bump(answered(it)?1:0); status[it.q.id]=g[k].ok?"pass":"fail";
        window.CLOUD&&CLOUD.log({question_id:it.q.id, kind:"pbq", domain:it.q.domain, level:lvl(it.q), correct:g[k].ok, score:+g[k].frac.toFixed(3), source:"exam"}); } });
    store.set("pbq-status",status);
    const pct=P?E/P:0, sc=scaled(pct), domPct={}; for(const d in dom) domPct[d]=dom[d].e/dom[d].p;
    hist.push({d:Date.now(), len:X.len, lvl:xlvl, score:sc, pct, secs, dom:domPct}); hist=hist.slice(-50); store.set("exam-history",hist);
    window.CLOUD&&CLOUD.exam({length:X.len, difficulty:xlvl, score:sc, pct:+pct.toFixed(4), secs, domain_pct:domPct});
    const pass=sc>=PASS;
    $("#score").textContent = `${hist.length} exam${hist.length>1?"s":""} taken · best ${Math.max(...hist.map(h=>h.score))}`;
    const domRows=[1,2,3,4,5].filter(d=>dom[d]).map(d=>{const p=domPct[d];return `<div class="dom" style="cursor:default"><span class="nm">${esc(DOMAINS[d])}<div class="muted">${X.items.filter(it=>it.q.domain===d).length} questions</div></span><span class="bar"><i class="${barCls(p)}" style="width:${Math.round(p*100)}%"></i></span><span class="stat">${pctS(p)}</span></div>`}).join("");
    const weakest=[1,2,3,4,5].filter(d=>dom[d]).sort((a,b)=>domPct[a]-domPct[b])[0];
    const review=X.items.map((it,k)=>{
      const q=it.q, gr=g[k];
      if(it.kind==="mc"){ const cs=MC.correctSet(q); return `<div class="review" data-ok="${gr.ok?1:0}"><div class="muted">Q${k+1} · ${esc(DOMAINS[q.domain])}</div><b>${esc(q.q)}</b>
        <div class="yours" style="color:${gr.ok?"var(--ok)":"var(--bad)"}">${gr.ok?"✓":"✗"} Your answer: ${it.sel.length?it.sel.map(x=>esc(q.o[x])).join(" + "):"(blank)"}</div>${gr.ok?"":`<div class="yours" style="color:var(--ok)">Correct: ${cs.map(x=>esc(q.o[x])).join(" + ")}</div>`}<p class="muted" style="margin:6px 0 0">${esc(q.e)}</p></div>`; }
      let det="";
      if(it.t==="build"||it.t==="topo") det=DIAG.items(q).map(x=>{ const v=it.vals[x.k]||"", ok=v===x.a; return `<div class="yours" style="color:${ok?"var(--ok)":"var(--bad)"}">${ok?"✓":"✗"} ${esc(x.label)} — you: ${esc(v||"(blank)")}${ok?"":` · correct: <b>${esc(x.a)}</b> <span class="muted">${esc(x.w||"")}</span>`}</div>`; }).join("");
      if(it.t==="grid"||((it.t==="build"||it.t==="topo")&&q.rows)) det+=q.rows.map((r,ri)=>{const yours=r.a.map((a,ci)=>it.vals[ri+"_"+ci]||"(blank)"); const ok=r.a.every((a,ci)=>{const v=it.vals[ri+"_"+ci]||""; return typeof a==="number"? Math.abs(parseFloat(String(v).replace(/[$,%\s]/g,""))-a)<=0.001*Math.max(1,Math.abs(a)) : v===a;}); return `<div class="yours" style="color:${ok?"var(--ok)":"var(--bad)"}">${ok?"✓":"✗"} ${esc(r.l)} — you: ${esc(yours.join(" / "))}${ok?"":` · correct: <b>${esc(r.a.join(" / "))}</b> <span class="muted">${esc(r.w)}</span>`}</div>`}).join("");
      else if(it.t==="order") det=`<div class="yours">Correct order: ${q.items.map((s,i)=>`${i+1}. ${esc(s)}`).join(" → ")}</div>`;
      else if(it.t==="multi") det=q.choices.map((c,i)=>{const on=it.checked.includes(i), ok=on===!!c.c; return `<div class="yours" style="color:${ok?"var(--ok)":"var(--bad)"}">${ok?"✓":"✗"} ${on?"[selected] ":""}${esc(c.t)} ${c.c?"(correct)":"(distractor)"}</div>`}).join("");
      return `<div class="review" data-ok="${gr.ok?1:0}"><div class="muted">Q${k+1} · PBQ · ${esc(DOMAINS[q.domain])} · ${Math.round(gr.frac*100)}% credit</div><b>${esc(q.title)}</b>${det}<p class="muted" style="margin:6px 0 0"><b>Key takeaway:</b> ${esc(q.explain)}</p></div>`;
    }).join("");
    $("#main").innerHTML = `
      <h2>Exam results</h2>
      <div class="card"><p class="big" style="color:${pass?"var(--ok)":"var(--bad)"}">${sc} <span style="font-size:18px">${pass?"— estimated PASS":"— estimated below passing"}</span></p>
        <p class="muted">${pctS(pct)} of points earned · passing estimate is ${PASS} · time used ${fmt(secs)} of ${fmt(X.limit)}. ${weakest?`Focus next on <b>${esc(DOMAINS[weakest])}</b>.`:""}</p></div>
      <div class="card"><h3>Score by domain</h3><div class="doms">${domRows}</div></div>
      <div class="actions"><button class="btn primary" data-ex="start">Take another exam</button><button class="btn" data-ex="home">Exam history</button><label class="muted" style="margin-left:auto"><input type="checkbox" id="onlywrong"> Show only questions I missed</label></div>
      <div class="card" id="reviewcard"><h3>Full review</h3>${review}</div>`;
    X=null; window.scrollTo(0,0);
  }

  document.addEventListener("click", e=>{
    const mv=e.target.closest("[data-xmv]"); if(mv&&X){ const it=X.items[X.i]; const [p,d]=mv.dataset.xmv.split(",").map(Number); [it.order[p],it.order[p+d]]=[it.order[p+d],it.order[p]]; it.touched=true; return show(); }
    const j=e.target.closest("[data-exjump]"); if(j&&X){ readDOM(); X.i=+j.dataset.exjump; X.confirm=false; return show(); }
    const b=e.target.closest("[data-ex]"); if(!b) return;
    const a=b.dataset.ex;
    if(a==="start") return start();
    if(a==="home") return home();
    if(a==="clearhist"){ hist=[]; store.set("exam-history",hist); return home(); }
    if(!X) return;
    readDOM();
    if(a==="next"){ if(X.i<X.items.length-1){X.i++; X.confirm=false; return show();} X.confirm=true; return show(); }
    if(a==="prev"){ X.i=Math.max(0,X.i-1); X.confirm=false; return show(); }
    if(a==="flag"){ X.items[X.i].flag=!X.items[X.i].flag; return show(); }
    if(a==="finish"){ X.confirm=true; return show(); }
    if(a==="cancel"){ X.confirm=false; return show(); }
    if(a==="cancel-bg"){ if(e.target===b){ X.confirm=false; return show(); } return; }
    if(a==="gridtoggle"){ X.grid=!X.grid; return show(); }
    if(a==="confirm") return finish();
  });
  document.addEventListener("change", e=>{
    if(e.target.name==="exlen"){ len=e.target.value; store.set("exam-len",len); }
    if(e.target.name==="exlvl"){ xlvl=e.target.value; store.set("exam-level",xlvl); }
    if(e.target.id==="onlywrong"){ document.querySelectorAll("#reviewcard .review").forEach(r=>r.style.display=(e.target.checked&&r.dataset.ok==="1")?"none":""); }
    if(X && e.target.closest && e.target.closest("[data-x],input[name=xopt],input[name=xmulti]")) { readDOM(); const n=X.items.length,u=X.items.filter(x=>!answered(x)).length; $("#score").textContent=`Practice exam in progress · ${n-u}/${n} answered`; const xa=$("#xans"); if(xa){ xa.textContent=`${n-u} of ${n} answered`; xa.previousElementSibling.firstElementChild.style.width=Math.round((n-u)/n*100)+"%"; } }
  });
  document.addEventListener("keydown", e=>{
    if(!X || TAB!=="exam" || e.ctrlKey || e.metaKey || e.altKey) return;
    if(X.confirm){ if(e.key==="Escape"){ X.confirm=false; show(); } return; }
    const tg=e.target; if(tg.matches && tg.matches("input[type=text],input[type=search],textarea,select")) return;
    const it=X.items[X.i], k=e.key.toLowerCase();
    if(it.kind==="mc"){ let n=-1; if(/^[1-9]$/.test(k)) n=+k-1; else if(/^[a-e]$/.test(k)) n=k.charCodeAt(0)-97;
      if(n>=0 && n<it.order.length){ const inp=document.querySelectorAll("input[name=xopt]")[n]; if(inp){ e.preventDefault(); if(inp.type==="checkbox") inp.checked=!inp.checked; else inp.checked=true; inp.dispatchEvent(new Event("change",{bubbles:true})); inp.focus({preventScroll:true}); } return; } }
    if(tg.closest && tg.closest("button,.term")) return;
    const click=sel=>{ const b=document.querySelector(sel); if(b && !b.disabled){ e.preventDefault(); b.click(); } };
    if(k==="f") return click("[data-ex=flag]");
    if(k==="arrowright") return click("[data-ex=next]");
    if(k==="arrowleft") return click("[data-ex=prev]");
  });
  document.addEventListener("diag:change", ()=>{ if(!X||TAB!=="exam") return; const n=X.items.length,u=X.items.filter(x=>!answered(x)).length; $("#score").textContent=`Practice exam in progress · ${n-u}/${n} answered`; const xa=$("#xans"); if(xa){ xa.textContent=`${n-u} of ${n} answered`; xa.previousElementSibling.firstElementChild.style.width=Math.round((n-u)/n*100)+"%"; } });
  function preset(o){ if(o.level){ xlvl=o.level; store.set("exam-level",xlvl); } }
  return { home, inProgress:()=>!!X, preset };
})();

// ---------------- Acronyms & ports reference ----------------
const REF = (() => {
  const A = [...PBQ.acr].sort((x,y)=>x.a.localeCompare(y.a, undefined, {sensitivity:"base"}));
  const P = PBQ.ports;
  const CATS = ["Crypto","Identity","Network","Wireless","Threats","Ops","Cloud","Hardware","Resilience","GRC","Dev"];
  const CATNAME = {Crypto:"Cryptography & PKI",Identity:"Identity & access",Network:"Networking & protocols",Wireless:"Wireless & mobile",Threats:"Threats & attacks",Ops:"Security operations",Cloud:"Cloud & virtualization",Hardware:"Hardware, endpoint & OT",Resilience:"Resilience & recovery",GRC:"Governance, risk & compliance",Dev:"Development & apps"};
  let known = store.get("ref-known", {});
  let st = Object.assign({view:"acr", q:"", cat:"all", key:false, bad:false, deck:"acr-key", unmastered:true}, store.get("ref-prefs", {}));
  let deck = [], di = 0, flipped = false, sess = {k:0,u:0};
  const save = () => store.set("ref-prefs", {view:st.view, cat:st.cat, key:st.key, deck:st.deck, unmastered:st.unmastered, qmode:st.qmode, qset:st.qset, qn:st.qn});
  const norm = s => s.toLowerCase();
  const hl = (s) => { const q=st.q.trim(); if(!q) return esc(s); const i=norm(s).indexOf(norm(q)); if(i<0) return esc(s); return esc(s.slice(0,i))+"<mark>"+esc(s.slice(i,i+q.length))+"</mark>"+esc(s.slice(i+q.length)); };

  function shell(inner){
    const sub = (v,l)=>`<button class="tab ${st.view===v?"on":""}" data-ref-view="${v}">${l}</button>`;
    $("#score").textContent = `${A.length} acronyms · ${P.length} ports · ${Object.values(known).filter(v=>v===1).length} mastered`;
    $("#main").innerHTML = `<h2>Acronyms &amp; ports</h2>
      <div class="tabs" style="display:inline-flex;margin-bottom:14px">${sub("acr","Acronyms")}${sub("ports","Ports")}${sub("cards","Flashcards")}${sub("quiz","Acronym quiz")}</div>${inner}`;
  }

  // ---- Acronyms ----
  function acrList(){
    const q=norm(st.q.trim());
    return A.filter(x=>(st.cat==="all"||x.c===st.cat) && (!st.key||x.k) && (!q || norm(x.a).includes(q) || norm(x.f).includes(q) || norm(x.d).includes(q)));
  }
  function acrRender(){
    const list=acrList();
    const el=$("#reflist"); if(!el) return;
    $("#refcount").textContent = `${list.length} of ${A.length}`;
    el.innerHTML = list.length ? list.map(x=>`<div class="acr ${known["a:"+x.a]===1?"mastered":""}">
      <div class="acr-h"><span class="acr-a">${hl(x.a)}</span>${x.k?'<span class="chip lvl-hard" title="High-yield for the exam">High-yield</span>':""}<span class="chip">${esc(CATNAME[x.c]||x.c)}</span></div>
      <div class="acr-f">${hl(x.f)}</div><div class="acr-d">${hl(x.d)}</div>${x.t?`<div class="acr-t"><b>Exam tip:</b> ${esc(x.t)}</div>`:""}</div>`).join("")
      : `<p class="muted">No matches.</p>`;
  }
  function acrView(){
    shell(`<div class="card refbar">
        <input type="search" id="refq" placeholder="Search acronym, name, or description (e.g. 'EAP', 'port 49', 'encryption')" value="${esc(st.q)}">
        <select id="refcat"><option value="all">All categories</option>${CATS.map(c=>`<option value="${c}" ${st.cat===c?"selected":""}>${CATNAME[c]} (${A.filter(x=>x.c===c).length})</option>`).join("")}</select>
        <label class="muted"><input type="checkbox" id="refkey" ${st.key?"checked":""}> High-yield only</label>
        <span class="muted" id="refcount"></span>
      </div><div id="reflist" class="acrgrid"></div>`);
    acrRender();
  }

  // ---- Ports ----
  function portRender(){
    const q=norm(st.q.trim());
    const list=P.filter(x=>(!st.bad||x.bad) && (!q || norm(x.p).includes(q) || norm(x.s).includes(q) || norm(x.d).includes(q) || norm(x.sec).includes(q)));
    const el=$("#reflist"); if(!el) return;
    $("#refcount").textContent = `${list.length} of ${P.length}`;
    el.innerHTML = `<table class="porttable"><thead><tr><th>Port</th><th>Protocol</th><th>Service</th><th>What it does</th><th>Secure alternative / note</th></tr></thead><tbody>${list.map(x=>`<tr>
      <td data-h="Port"><b class="portnum">${hl(x.p)}</b></td><td data-h="Protocol">${esc(x.pr)}</td>
      <td data-h="Service"><b>${hl(x.s)}</b>${x.bad?' <span class="chip lvl-hard">Insecure</span>':""}${x.k?' <span class="chip">High-yield</span>':""}</td>
      <td data-h="What it does">${hl(x.d)}</td><td data-h="Secure alternative">${hl(x.sec)}</td></tr>`).join("")}</tbody></table>`;
  }
  function portView(){
    shell(`<div class="card refbar">
        <input type="search" id="refq" placeholder="Search port or service (e.g. '636', 'RADIUS', 'mail')" value="${esc(st.q)}">
        <label class="muted"><input type="checkbox" id="refbad" ${st.bad?"checked":""}> Insecure protocols only</label>
        <span class="muted" id="refcount"></span>
      </div>
      <div class="card" style="font-size:13.5px"><b>Patterns to memorize:</b> secure versions usually move to a new port (HTTP 80 → HTTPS 443, LDAP 389 → LDAPS 636, IMAP 143 → IMAPS 993, POP3 110 → POP3S 995, FTP 21 → FTPS 989/990).
      <b>Exceptions:</b> SNMPv3 keeps 161/162, SFTP uses SSH's 22, and SMTP uses STARTTLS on 25/587 (implicit TLS on 465).</div>
      <div id="reflist"></div>`);
    portRender();
  }

  // ---- Flashcards ----
  const DECKS = {
    "acr-key": {label:"Acronyms — high-yield", build:()=>A.filter(x=>x.k).map(acrCard)},
    "acr-all": {label:"Acronyms — all", build:()=>A.map(acrCard)},
    ...Object.fromEntries(CATS.map(c=>["acr-"+c,{label:"Acronyms — "+CATNAME[c], build:()=>A.filter(x=>x.c===c).map(acrCard)}])),
    "port-p2s": {label:"Ports — port → service", build:()=>P.map(x=>({key:"p:"+x.p, front:`<div class="fc-big">${esc(x.p)}</div><div class="muted">${esc(x.pr)} — what service?</div>`, back:`<div class="fc-big">${esc(x.s)}</div><p>${esc(x.d)}</p><p class="muted"><b>Secure alternative:</b> ${esc(x.sec)}</p>`}))},
    "port-s2p": {label:"Ports — service → port", build:()=>P.map(x=>({key:"p:"+x.p, front:`<div class="fc-big">${esc(x.s)}</div><div class="muted">Which port(s) and protocol?</div>`, back:`<div class="fc-big">${esc(x.p)} <span class="muted" style="font-size:16px">${esc(x.pr)}</span></div><p>${esc(x.d)}</p><p class="muted"><b>Secure alternative:</b> ${esc(x.sec)}</p>`}))}
  };
  function acrCard(x){ return {key:"a:"+x.a, front:`<div class="fc-big">${esc(x.a)}</div><div class="muted">What does it stand for, and what does it do?</div>`, back:`<div class="fc-full">${esc(x.f)}</div><p>${esc(x.d)}</p>${x.t?`<p class="acr-t"><b>Exam tip:</b> ${esc(x.t)}</p>`:""}`}; }
  function buildDeck(){
    let d=DECKS[st.deck] ? DECKS[st.deck].build() : DECKS["acr-key"].build();
    if(st.unmastered){ const u=d.filter(c=>known[c.key]!==1); if(u.length) d=u; }
    deck=shuffle(d); di=0; flipped=false; sess={k:0,u:0};
  }
  function cardsView(){
    if(!deck.length) buildDeck();
    const total=DECKS[st.deck]?DECKS[st.deck].build():[];
    const mastered=total.filter(c=>known[c.key]===1).length;
    const c=deck[di];
    shell(`<div class="card refbar">
        <select id="refdeck">${Object.entries(DECKS).map(([k,v])=>`<option value="${k}" ${st.deck===k?"selected":""}>${esc(v.label)}</option>`).join("")}</select>
        <label class="muted"><input type="checkbox" id="refunm" ${st.unmastered?"checked":""}> Skip cards I've mastered</label>
        <span class="muted">${mastered} / ${total.length} mastered in this deck</span>
      </div>
      ${c ? `<div class="fc ${flipped?"flipped":""}" data-ref-act="flip">
          <div class="muted" style="font-size:12px">Card ${di+1} of ${deck.length} · this session: ${sess.k} known, ${sess.u} to review</div>
          <div class="fc-front">${c.front}</div>
          ${flipped?`<div class="fc-back">${c.back}</div>`:`<div class="muted" style="margin-top:18px">Click or press Space to reveal</div>`}
        </div>
        <div class="actions">${flipped
          ? `<button class="btn" data-ref-act="miss">✗ Didn't know (1)</button><button class="btn primary" data-ref-act="know">✓ Knew it (2)</button>`
          : `<button class="btn primary" data-ref-act="flip">Reveal</button>`}
          <button class="btn" data-ref-act="reshuffle" style="margin-left:auto">Restart deck</button></div>`
        : `<div class="card"><p class="big">Deck complete</p><p class="muted">${sess.k} known · ${sess.u} to review. Cards you missed stay in the "not mastered" pool.</p>
           <div class="actions"><button class="btn primary" data-ref-act="reshuffle">Go again</button></div></div>`}
      <p class="tip">Keyboard: Space = reveal, 1 = didn't know, 2 = knew it. A card counts as mastered once you mark it known; marking it missed puts it back in the pool.</p>`);
  }
  function mark(ok){ const c=deck[di]; if(!c) return; known[c.key]=ok?1:0; store.set("ref-known",known); ok?sess.k++:sess.u++; di++; flipped=false; cardsView(); }

  // ---- Acronym quiz (auto-generated multiple choice) ----
  let QZ = null;
  const QMODES = {f:"Acronym → full name", a:"Full name → acronym", d:"Description → acronym"};
  const QSETS = {key:"High-yield", all:"All acronyms", weak:"Ones I've missed or not mastered", ...Object.fromEntries(CATS.map(c=>[c,CATNAME[c]]))};
  const base = a => a.replace(/ \(.*\)$/,"");   // "MAC (access)" -> "MAC"
  function quizPool(){
    const set=st.qset||"key";
    if(set==="key") return A.filter(x=>x.k);
    if(set==="all") return A;
    if(set==="weak") return A.filter(x=>known["a:"+x.a]!==1);
    return A.filter(x=>x.c===set);
  }
  function makeQ(x, mode){
    const same=A.filter(y=>y!==x && y.c===x.c && base(y.a)!==base(x.a) && y.f!==x.f);
    const pool=same.length>=3?same:A.filter(y=>y!==x && base(y.a)!==base(x.a) && y.f!==x.f);
    const ds=shuffle(pool).slice(0,3);
    const show = y => mode==="f" ? y.f : base(y.a);
    const opts=shuffle([x,...ds]);
    const prompt = mode==="f" ? `<div class="fc-big">${esc(base(x.a))}</div><div class="muted">What does it stand for?</div>`
      : mode==="a" ? `<div class="fc-full">${esc(x.f)}</div><div class="muted">Which acronym?</div>`
      : `<div style="font-size:16px">${esc(x.d)}</div><div class="muted" style="margin-top:6px">Which acronym is this describing?</div>`;
    return {x, prompt, opts:opts.map(o=>({y:o, label:show(o)})), pick:null};
  }
  function quizStart(){
    const pool=quizPool(); const n=st.qn||20;
    QZ = {items: shuffle(pool).slice(0,n).map(x=>makeQ(x, st.qmode||"f")), i:0, right:0};
    quizView();
  }
  function quizView(){
    if(!QZ){
      const pool=quizPool();
      const r=(name,val,label,cur)=>`<label><input type="radio" name="${name}" value="${val}" ${String(cur)===String(val)?"checked":""}> ${label}</label>`;
      shell(`<div class="card"><h3>Question style</h3><div class="row">${Object.entries(QMODES).map(([k,v])=>r("qmode",k,v,st.qmode||"f")).join("")}</div></div>
        <div class="card"><h3>Which acronyms</h3><select id="qset">${Object.entries(QSETS).map(([k,v])=>`<option value="${k}" ${ (st.qset||"key")===k?"selected":""}>${esc(v)}</option>`).join("")}</select> <span class="muted">${pool.length} available</span></div>
        <div class="card"><h3>How many</h3><div class="row">${[10,20,50,9999].map(n=>r("qn",n,n===9999?"All":n,st.qn||20)).join("")}</div></div>
        <div class="actions"><button class="btn primary" data-ref-act="qstart" ${pool.length<1?"disabled":""}>Start quiz</button></div>
        <p class="tip">Wrong answers come from the same category, so you have to know the difference (e.g., SAML vs SAE vs SASE), not just recognize the letters. Correct answers count as mastered, and misses go back into the "missed" pool.</p>`);
      return;
    }
    const it=QZ.items[QZ.i];
    if(!it){
      const pct=QZ.items.length?Math.round(QZ.right/QZ.items.length*100):0;
      const missed=QZ.items.filter(q=>q.pick!==q.x);
      shell(`<div class="card"><p class="big" style="color:${pct>=85?"var(--ok)":"var(--bad)"}">${pct}%</p><p class="muted">${QZ.right} of ${QZ.items.length} correct.</p></div>
        ${missed.length?`<div class="card"><h3>Review what you missed</h3>${missed.map(q=>`<div class="review"><b>${esc(q.x.a)}</b> — ${esc(q.x.f)}<p class="muted" style="margin:4px 0 0">${esc(q.x.d)}${q.x.t?` <b>Tip:</b> ${esc(q.x.t)}`:""}</p></div>`).join("")}</div>`:""}
        <div class="actions"><button class="btn primary" data-ref-act="qstart">Another round</button><button class="btn" data-ref-act="qsetup">Change settings</button></div>`);
      return;
    }
    const answered=it.pick!==null;
    shell(`<div class="meta"><span class="chip">Question ${QZ.i+1} of ${QZ.items.length}</span><span class="chip">${esc(CATNAME[it.x.c])}</span><span class="chip">Score ${QZ.right}</span></div>
      <div class="fc" style="cursor:default;min-height:0;padding:26px">${it.prompt}</div>
      <ul class="opts" style="margin-top:14px">${it.opts.map((o,k)=>{let cls=""; if(answered){ if(o.y===it.x) cls="ok"; else if(o.y===it.pick) cls="bad"; } return `<li><label class="opt ${cls}"><input type="radio" name="qzopt" data-qz="${k}" ${answered?"disabled":""} ${o.y===it.pick?"checked":""}><span>${esc(o.label)}</span></label></li>`;}).join("")}</ul>
      ${answered?`<div class="feedback ${it.pick===it.x?"pass":"fail"}"><b>${esc(it.x.a)}</b> = ${esc(it.x.f)}<p style="margin:6px 0 0">${esc(it.x.d)}</p>${it.x.t?`<p class="acr-t" style="margin:6px 0 0"><b>Exam tip:</b> ${esc(it.x.t)}</p>`:""}</div>
        <div class="actions"><button class="btn primary" data-ref-act="qnext">${QZ.i===QZ.items.length-1?"See results":"Next →"} (Enter)</button><button class="btn" data-ref-act="qsetup" style="margin-left:auto">End quiz</button></div>`
      :`<p class="tip">Keyboard: 1–4 to answer, Enter for next.</p>`}`);
  }
  function quizAnswer(k){ const it=QZ&&QZ.items[QZ.i]; if(!it||it.pick!==null) return; it.pick=it.opts[k].y; const ok=it.pick===it.x; if(ok) QZ.right++; known["a:"+it.x.a]=ok?1:0; store.set("ref-known",known);
    window.CLOUD&&CLOUD.log({question_id:("acr:"+it.x.a).slice(0,80), kind:"acronym", correct:ok, score:ok?1:0, source:"quiz"}); quizView(); }

  function home(){ ({acr:acrView, ports:portView, cards:cardsView, quiz:quizView})[st.view](); }
  function open(view, d){ st.view=view; st.q=""; if(d){ st.deck=d; buildDeck(); } save(); }

  document.addEventListener("click", e=>{
    if(TAB!=="ref") return;
    const v=e.target.closest("[data-ref-view]"); if(v){ st.view=v.dataset.refView; st.q=""; save(); return home(); }
    const a=e.target.closest("[data-ref-act]"); if(!a) return;
    const act=a.dataset.refAct;
    if(act==="flip"){ if(!flipped){ flipped=true; cardsView(); } return; }
    if(act==="know") return mark(true);
    if(act==="miss") return mark(false);
    if(act==="reshuffle"){ buildDeck(); return cardsView(); }
    if(act==="qstart") return quizStart();
    if(act==="qnext"){ QZ.i++; return quizView(); }
    if(act==="qsetup"){ QZ=null; return quizView(); }
  });
  document.addEventListener("input", e=>{
    if(TAB!=="ref" || e.target.id!=="refq") return;
    st.q=e.target.value; (st.view==="ports"?portRender:acrRender)();
  });
  document.addEventListener("change", e=>{
    if(TAB!=="ref") return; const t=e.target;
    if(t.id==="refcat"){ st.cat=t.value; save(); acrRender(); }
    if(t.id==="refkey"){ st.key=t.checked; save(); acrRender(); }
    if(t.id==="refbad"){ st.bad=t.checked; portRender(); }
    if(t.id==="refdeck"){ st.deck=t.value; save(); buildDeck(); cardsView(); }
    if(t.id==="refunm"){ st.unmastered=t.checked; save(); buildDeck(); cardsView(); }
    if(t.dataset && t.dataset.qz!==undefined) quizAnswer(+t.dataset.qz);
    if(t.name==="qmode"){ st.qmode=t.value; save(); }
    if(t.name==="qn"){ st.qn=+t.value; save(); }
    if(t.id==="qset"){ st.qset=t.value; save(); quizView(); }
  });
  document.addEventListener("keydown", e=>{
    if(TAB==="ref" && st.view==="quiz" && QZ && !/select|textarea/i.test(e.target.tagName) && !(e.target.type==="text"||e.target.type==="search")){
      const it=QZ.items[QZ.i];
      if(it && it.pick===null && /^[1-4]$/.test(e.key)){ e.preventDefault(); return quizAnswer(+e.key-1); }
      if(it && it.pick!==null && e.key==="Enter"){ e.preventDefault(); QZ.i++; return quizView(); }
      return;
    }
    if(TAB!=="ref" || st.view!=="cards" || /input|select|textarea/i.test(e.target.tagName)) return;
    if(e.key===" "){ e.preventDefault(); if(!flipped && deck[di]){ flipped=true; cardsView(); } }
    else if(flipped && e.key==="1") mark(false);
    else if(flipped && e.key==="2") mark(true);
  });
  return { home, open };
})();

// ---------------- Crash course ----------------
const CC = (() => {
  const S = PBQ.crash;
  let done = store.get("cc-done", {});
  let cur = store.get("cc-cur", S.length ? S[0].id : null);
  const idx = () => Math.max(0, S.findIndex(s=>s.id===cur));
  function nav(){
    const n=S.filter(s=>done[s.id]).length;
    let html=`<div class="ccprog"><div class="muted">${n} of ${S.length} sections reviewed</div><div class="bar" style="width:100%"><i style="width:${S.length?Math.round(n/S.length*100):0}%"></i></div></div>`, last="";
    S.forEach(s=>{ if(s.group!==last){ html+=`<div class="grp">${esc(s.group)}</div>`; last=s.group; }
      html+=`<button class="${s.id===cur?"active":""}" data-cc-go="${s.id}"><span class="num ${done[s.id]?"pass":""}">${done[s.id]?"✓":"•"}</span><span>${esc(s.title)}</span></button>`; });
    html+=`<div class="tools"><button data-cc-reset="1">↺ Reset reviewed marks</button></div>`;
    $("#nav").innerHTML=html;
    $("#score").textContent=`Crash course · ${n}/${S.length} reviewed`;
  }
  function home(){
    if(!S.length){ $("#main").innerHTML='<div class="err">No crash course content loaded.</div>'; return; }
    const i=idx(), s=S[i];
    try{history.replaceState(null,"","#crash-"+s.id)}catch(e){}
    nav();
    $("#main").innerHTML = `
      <div class="mobile-nav"><select id="ccnav">${S.map(x=>`<option value="${x.id}" ${x.id===s.id?"selected":""}>${done[x.id]?"✓ ":""}${esc(x.group)} — ${esc(x.title)}</option>`).join("")}</select></div>
      <div class="meta"><span class="chip">Crash course</span><span class="chip">${esc(s.group)}</span><span class="chip">${i+1} of ${S.length}</span></div>
      <h2>${esc(s.title)}</h2>
      <div class="cc-body">${s.html}</div>
      <div class="actions">
        <button class="btn" data-cc-step="-1" ${i===0?"disabled":""}>← Previous</button>
        <label class="ccdone"><input type="checkbox" id="ccdone" ${done[s.id]?"checked":""}> I've reviewed this</label>
        <button class="btn primary" data-cc-step="1" ${i===S.length-1?"disabled":""}>Next →</button>
      </div>`;
    window.scrollTo(0,0);
  }
  function go(id){ cur=id; store.set("cc-cur",cur); home(); }
  const JUMP = {
    "mcq-hard":()=>{ MC.preset({levels:["hard"], doms:[1,2,3,4,5], pool:"all", mode:"study"}); setTab("mcq"); },
    "mcq-missed":()=>{ MC.preset({levels:["easy","medium","hard"], doms:[1,2,3,4,5], pool:"missed", mode:"study"}); setTab("mcq"); },
    "pbq-hard":()=>{ pbqLevel="hard"; store.set("pbq-level","hard"); const v=visibleIdx(); if(v.length) cur_pbq(v[0]); setTab("pbq"); },
    "exam":()=>{ EX.preset({level:"all"}); setTab("exam"); },
    "exam-hard":()=>{ EX.preset({level:"hard"}); setTab("exam"); },
    "ref-acr-cards":()=>{ REF.open("cards","acr-key"); setTab("ref"); },
    "ref-port-cards":()=>{ REF.open("cards","port-s2p"); setTab("ref"); },
    "ref-ports":()=>{ REF.open("ports"); setTab("ref"); },
    "ref-acr-quiz":()=>{ REF.open("quiz"); setTab("ref"); }
  };
  [1,2,3,4,5].forEach(d=>JUMP["mcq-d"+d]=()=>{ MC.preset({doms:[d], levels:["easy","medium","hard"], pool:"all", mode:"study"}); setTab("mcq"); });
  function cur_pbq(i){ cur_set(i); }
  document.addEventListener("click", e=>{
    const j=e.target.closest("[data-cc]"); if(j && JUMP[j.dataset.cc]) return JUMP[j.dataset.cc]();
    if(TAB!=="crash") return;
    const g=e.target.closest("[data-cc-go]"); if(g) return go(g.dataset.ccGo);
    const st=e.target.closest("[data-cc-step]"); if(st){ const i=idx()+(+st.dataset.ccStep); if(S[i]) go(S[i].id); return; }
    if(e.target.closest("[data-cc-reset]")){ done={}; store.set("cc-done",done); home(); }
  });
  document.addEventListener("change", e=>{
    if(TAB!=="crash") return;
    if(e.target.id==="ccdone"){ done[cur]=e.target.checked; if(!done[cur]) delete done[cur]; store.set("cc-done",done); nav(); }
    if(e.target.id==="ccnav") go(e.target.value);
  });
  return { home, go };
})();
function cur_set(i){ cur=i; }
document.addEventListener("click", e=>{ const r=e.target.closest("[data-ccreview]"); if(r){ const id="d"+r.dataset.ccreview; setTab("crash"); if(PBQ.crash.some(s=>s.id===id)) CC.go(id); } });

// Initial route
(() => { const h=(location.hash||"").slice(1); if(h==="mcq"||h==="exam"||h==="ref") return setTab(h);
  if(h==="mine"||h==="admin"||h==="account"||h==="progress"){ window.__pendingTab=h==="progress"?"account":h; return setTab("pbq"); }   // opened by app/*-ui.js once they load
  if(h==="crash"||h.startsWith("crash-")){ const id=h.slice(6); setTab("crash"); if(id && PBQ.crash.some(s=>s.id===id)) CC.go(id); return; } const hi=Q.findIndex(x=>x.id===h); if(hi>=0) cur=hi; setTab("pbq"); })();
</script>

<script src="app/questions-ui.js"></script>
<script src="app/account-ui.js"></script>
