<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Security+ PBQ Practice Lab</title>
<!-- Cloud settings (generated at deploy from env vars; absent on local copies) -->
<script src="config.js"></script>
<script>
// Show the sign-in page first when cloud sync is configured and there's no session / guest choice yet.
(() => { try {
  const c = window.SECPLUS_CONFIG || {}; if (!c.supabaseUrl || !c.supabaseAnonKey) return;
  const ref = new URL(c.supabaseUrl).hostname.split(".")[0];
  window.__landingHash = location.hash; // Supabase puts link errors here; read before the app rewrites the hash
  if (!localStorage.getItem(`sb-${ref}-auth-token`) && localStorage.getItem("sp:__guest") !== "1") document.documentElement.classList.add("auth-mode");
} catch (e) {} })();
</script>
<style>
/* ===== Design tokens (redesign spec §3) — fonts are self-hosted in /fonts (OFL), so the CSP stays 'self' ===== */
@font-face{font-family:"IBM Plex Sans";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/ibm-plex-sans-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/ibm-plex-sans-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/ibm-plex-sans-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/ibm-plex-sans-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/ibm-plex-mono-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/ibm-plex-mono-latin-600-normal.woff2) format("woff2")}
:root{
  --bg:#F9FAFC;--panel:#FFFFFF;--ink:#141B26;--muted:#5C6470;--line:#E0E4E9;
  --accent:#0E60CA;--accent-ink:#FFFFFF;--ok:#15803D;--ok-bg:#E3FBE8;--bad:#CC3336;--bad-bg:#FFEFED;
  --code-bg:#0F1720;--code-ink:#D6E2F0;--chip:#F2F5F8;
  --subtle:#6D747E;--line-strong:#CCD1D9;--accent-hover:#004FB1;--accent-soft:#EAF3FF;--accent-soft-ink:#004AA5;
  --ok-ink:#015D2D;--bad-ink:#A51E24;--warn:#E69825;--warn-bg:#FFF4D8;--warn-ink:#905211;--focus:#0E60CA;
  --on-fill:#FFFFFF;
  --r-sm:6px;--r-md:8px;--r-lg:12px;
  --shadow-xs:0 1px 2px rgba(20,27,38,.05);
  --shadow-sm:0 1px 3px rgba(20,27,38,.07),0 1px 2px -1px rgba(20,27,38,.05);
  --shadow-md:0 8px 24px -6px rgba(20,27,38,.12),0 2px 6px -2px rgba(20,27,38,.06);
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --t-fast:120ms ease-out;--t-med:180ms ease-out;
  --hdr:100px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0D1014;--panel:#14171D;--ink:#E8EBEF;--muted:#9EA5AE;--line:#282D33;
    --accent:#5FA1F3;--accent-ink:#0A1018;--ok:#5DC47E;--ok-bg:#112D1A;--bad:#F47B74;--bad-bg:#421C19;
    --code-bg:#0A0E13;--chip:#1C2127;
    --subtle:#858C96;--line-strong:#383E45;--accent-hover:#7CB4FC;--accent-soft:#152946;--accent-soft-ink:#9DC7FE;
    --ok-ink:#7FD89B;--bad-ink:#FF9C95;--warn:#EEB154;--warn-bg:#3A270B;--warn-ink:#F4C677;--focus:#7CB4FC;
    --on-fill:#0A1018;
    --shadow-xs:0 1px 2px rgba(0,0,0,.4);--shadow-sm:0 1px 3px rgba(0,0,0,.5);--shadow-md:0 8px 24px -6px rgba(0,0,0,.6);
  }
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;align-items:center;gap:16px;padding:14px 22px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
header h1{font-size:17px;margin:0;font-weight:650;white-space:nowrap}
header .score{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
@media (max-width:700px){header .score{display:none}}
header .sub{color:var(--muted);font-size:13px}
header .score{margin-left:auto;font-size:13px;color:var(--muted)}
.wrap{display:grid;grid-template-columns:280px 1fr;min-height:calc(100vh - 56px)}
nav{border-right:1px solid var(--line);background:var(--panel);padding:12px 10px;overflow:auto;max-height:calc(100vh - 56px);position:sticky;top:56px}
nav .grp{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:12px 10px 4px;font-weight:600}
nav button{display:flex;width:100%;text-align:left;gap:10px;align-items:flex-start;background:none;border:0;color:var(--ink);padding:7px 10px;border-radius:8px;cursor:pointer;font:inherit;font-size:14px}
nav button:hover{background:var(--chip)}
nav button.active{background:var(--chip);font-weight:600}
nav .num{flex:0 0 24px;height:22px;border-radius:11px;display:grid;place-items:center;font-size:11.5px;background:var(--line);color:var(--ink)}
nav .num.pass{background:var(--ok);color:#fff}
nav .num.fail{background:var(--bad);color:#fff}
nav .tools{border-top:1px solid var(--line);margin-top:10px;padding-top:10px}
.mobile-nav{display:none}
.mobile-nav select{width:100%;padding:9px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit}
main{padding:22px 28px 60px;max-width:1050px}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.chip{background:var(--chip);border-radius:999px;padding:2px 10px;font-size:12px;color:var(--muted)}
h2{margin:4px 0 12px;font-size:22px}
.scenario{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:16px}
.scenario p{margin:0 0 8px}.scenario p:last-child{margin:0}
.scenario ol,.scenario ul{margin:6px 0 8px;padding-left:22px}
pre.log{background:var(--code-bg);color:var(--code-ink);padding:14px;border-radius:8px;overflow:auto;font:12.5px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;margin:10px 0 0;white-space:pre}
.task{font-weight:600;margin:0 0 10px}
table{width:100%;border-collapse:separate;border-spacing:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:var(--chip)}
tr:last-child td{border-bottom:0}
td.lbl{font-weight:500;min-width:180px}
select,input[type=text]{width:100%;min-width:110px;padding:7px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);font:inherit;font-size:14px}
select.ok,input.ok{border-color:var(--ok);background:var(--ok-bg)}
select.bad,input.bad{border-color:var(--bad);background:var(--bad-bg)}
.why{display:none;font-size:13px;color:var(--muted);margin-top:6px;font-weight:400}
.reveal .why{display:block}
.correct{display:none;font-size:12.5px;color:var(--ok);margin-top:4px;font-weight:600}
.reveal .correct{display:block}
.order,.multi{list-style:none;padding:0;margin:0;background:var(--panel);border:1px solid var(--line);border-radius:10px}
.order li,.multi li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
.order li:last-child,.multi li:last-child{border-bottom:0}
.order .pos{width:24px;height:24px;border-radius:6px;background:var(--chip);display:grid;place-items:center;font-size:12px;font-weight:600;flex:0 0 24px}
.order li.ok,.multi li.ok{background:var(--ok-bg)}.order li.bad,.multi li.bad{background:var(--bad-bg)}
.order .txt,.multi .txt{flex:1}
.order .mv{display:flex;gap:4px}
.order .mv button{width:30px;height:28px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;cursor:pointer;font-size:14px}
.order .mv button:disabled{opacity:.35;cursor:default}
.multi label{display:flex;gap:10px;align-items:flex-start;cursor:pointer;flex:1}
.multi input{margin-top:4px;width:17px;height:17px}
.fb{font-size:13px;color:var(--muted);margin-top:4px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 10px;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:9px 16px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:hover{filter:brightness(.97)}
.timer{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
.result{padding:12px 14px;border-radius:8px;margin-top:6px;display:none}
.result.show{display:block}
.result.pass{background:var(--ok-bg);color:var(--ok)}
.result.fail{background:var(--bad-bg);color:var(--bad)}
.explain{display:none;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;padding:12px 16px;margin-top:12px}
.reveal .explain{display:block}
.tip{font-size:13px;color:var(--muted);margin-top:24px;border-top:1px solid var(--line);padding-top:12px}
.err{background:var(--bad-bg);color:var(--bad);padding:14px;border-radius:8px}
.term{background:#0b0f14;color:#d1e4d1;border-radius:10px;margin:0 0 16px;border:1px solid #1f2933;font:12.8px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;cursor:text}
.term-out{white-space:pre-wrap;word-break:break-word;padding:12px 14px 4px;max-height:380px;overflow:auto}
.term-in{display:flex;gap:8px;align-items:center;padding:6px 14px 12px}
.term-in input{flex:1;background:transparent;border:0;outline:0;color:#e9f5e9;font:inherit;padding:0;min-width:0}
.t-prompt{color:#7ee787;white-space:nowrap}.t-dim{color:#8b98a5}.t-err{color:#ff8a80}
.tabs{display:flex;gap:4px;background:var(--chip);padding:3px;border-radius:9px;overflow-x:auto;max-width:100%;scrollbar-width:none}
.tab{border:0;background:none;color:var(--muted);font:inherit;font-size:13.5px;font-weight:600;padding:6px 12px;border-radius:7px;cursor:pointer;white-space:nowrap;flex:0 0 auto}
.tab.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.wrap.single{grid-template-columns:1fr}.wrap.single nav{display:none}.wrap.single main{margin:0 auto;width:100%;max-width:860px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:15px}
.doms{display:grid;gap:8px}
.dom{display:flex;align-items:center;gap:12px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.dom input{width:17px;height:17px}
.dom .nm{flex:1}
.bar{width:120px;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.bar i.mid{background:var(--warn)}.bar i.low{background:var(--bad)}
.stat{font-size:12.5px;color:var(--muted);min-width:110px;text-align:right}
.row{display:flex;gap:18px;flex-wrap:wrap}
.row label{display:flex;gap:6px;align-items:center;cursor:pointer}
.opts{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:9px;background:var(--panel);cursor:pointer}
.opt input{margin-top:3px;width:17px;height:17px;flex:0 0 auto}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.qtext{font-size:16.5px;font-weight:550;margin:6px 0 14px}
.feedback{margin-top:14px;padding:14px 16px;border-radius:9px;border:1px solid var(--line);background:var(--panel);border-left:4px solid var(--accent)}
.feedback.pass{border-left-color:var(--ok)}.feedback.fail{border-left-color:var(--bad)}
.flagged{color:var(--warn);font-weight:600}
.grid-nav{display:flex;flex-wrap:wrap;gap:5px;margin-top:12px}
.grid-nav button{width:32px;height:30px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);cursor:pointer;font-size:12px}
.grid-nav button.ans{background:var(--chip);font-weight:600}.grid-nav button.cur{outline:2px solid var(--accent)}.grid-nav button.fl{border-color:var(--warn);color:var(--warn)}
.big{font-size:34px;font-weight:700;margin:0}
.review{border-top:1px solid var(--line);padding:12px 0}
.review .yours{font-size:13px}
.muted{color:var(--muted);font-size:13px}
.chip-custom{background:#e8e3ff;color:#4b3aa8}
/* --- sign-in page --- */
#auth-page{display:none}
.auth-mode header .tabs,.auth-mode header .score,.auth-mode header .acct,.auth-mode .wrap{display:none!important}
.auth-mode #auth-page{display:block}
.auth-wrap{max-width:1040px;margin:0 auto;padding:48px 24px 60px;display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:start}
.auth-brand{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.auth-pitch h1{font-size:34px;line-height:1.15;margin:10px 0 18px}
.auth-pitch ul{padding-left:20px;margin:0;line-height:1.6}.auth-pitch li{margin:8px 0}
.auth-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px 26px;box-shadow:0 6px 24px rgba(0,0,0,.06)}
.auth-card h2{margin:0 0 6px}.auth-card hr{border:0;border-top:1px solid var(--line);margin:18px 0 12px}
.auth-card .f{display:block;margin:12px 0}.auth-card .f span{display:block;font-size:13px;font-weight:600;margin-bottom:4px}
.auth-card input{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font:inherit}
.btn.wide{width:100%}.auth-links{margin-top:14px}
.linkbtn{background:none;border:0;color:var(--accent);font:inherit;font-weight:600;cursor:pointer;padding:0}
.cfg-warning{background:#fff3d6;color:#5c3d00;border-bottom:1px solid #e6c97a;padding:10px 22px;font-size:13.5px}
@media (prefers-color-scheme:dark){.cfg-warning{background:#3a2e10;color:#ffdf9a;border-color:#5c4a1c}}
@media (max-width:820px){.auth-wrap{grid-template-columns:1fr;padding:24px 16px}.auth-pitch h1{font-size:26px}}
/* --- account dashboard --- */
.acc-top{display:grid;grid-template-columns:1fr 2fr;gap:14px}
.acc-top .card{margin-bottom:0}.cd{text-align:center}.cd-num{font-size:52px;font-weight:750;line-height:1.05}
.ready-v{font-size:34px;font-weight:750;margin:2px 0 6px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ready.tone-ok{border-left:4px solid var(--ok)}.ready.tone-mid{border-left:4px solid var(--warn)}.ready.tone-bad{border-left:4px solid var(--bad)}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:14px 0}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.tile-v{font-size:26px;font-weight:750}.tile-l{font-size:13px;font-weight:600;margin-top:2px}.tile-s{font-size:12px;color:var(--muted);margin-top:4px}
.row label.f2{display:flex;flex-direction:column;align-items:stretch;gap:4px;text-align:left}
.f2 input[type=text],.f2 input[type=date],.f2 input[type=password]{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font:inherit;font-weight:400}
.domtbl td{vertical-align:middle}.domtbl .bar{width:140px;display:inline-block;vertical-align:middle}
td.mini{display:flex;gap:3px;align-items:flex-end;height:40px}
.mini-b{width:10px;border-radius:2px;background:var(--ok);display:inline-block}.mini-b.mid{background:var(--warn)}.mini-b.low{background:var(--bad)}.mini-b.none{height:4px;background:var(--line)}
.act{display:flex;gap:6px;align-items:flex-end;height:96px;padding-top:6px}
.act-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.act-bar{width:100%;max-width:26px;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}
.act-d{font-size:11px;color:var(--muted);margin-top:4px}
@media (max-width:900px){.acc-top{grid-template-columns:1fr}.tiles{grid-template-columns:repeat(2,1fr)}}
.btn.sm{padding:5px 10px;font-size:13px}.btn.danger{border-color:var(--bad);color:var(--bad)}
.vis-pending{background:#fff3d6;color:#8a5a00}.vis-public{background:var(--ok-bg);color:var(--ok)}.vis-rejected{background:var(--bad-bg);color:var(--bad)}
table.qlist td{font-size:14px;vertical-align:top}.qact{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.editor .f{display:block;margin:12px 0}.editor .f>span,.editor label.f{font-size:13px;font-weight:600}
.editor textarea,.editor input[type=text]{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--ink);font:inherit;font-weight:400;font-size:14px;margin-top:4px}
.editor textarea.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
.editor .row{gap:14px}.f2{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;min-width:220px;flex:1}
.edrow{display:flex;gap:8px;align-items:center;margin:6px 0}.edrow input[type=text]{margin-top:0}.edrow input[type=checkbox]{width:18px;height:18px;flex:0 0 auto}
.edrow select{max-width:240px}.edrow .pos{width:24px;height:24px;border-radius:6px;background:var(--chip);display:grid;place-items:center;font-size:12px;font-weight:600;flex:0 0 24px}
@media (prefers-color-scheme:dark){.vis-pending{background:#3a2e10;color:#ffcf6b}}
@media (prefers-color-scheme:dark){.chip-custom{background:#2c2550;color:#c9bfff}}
.acct{display:flex;gap:8px;align-items:center;flex:0 0 auto}
.acct-btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px;cursor:pointer;display:flex;align-items:center;gap:6px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--muted)}.dot-ok{background:var(--ok)}.dot-err{background:var(--bad)}.dot-sync{background:var(--warn)}
.countdown{white-space:nowrap}
.modal-bg{position:fixed;inset:0;background:rgba(10,14,20,.45);display:flex;align-items:flex-start;justify-content:center;padding:70px 16px;z-index:50;overflow:auto}
.modal{background:var(--panel);color:var(--ink);border-radius:14px;padding:22px 24px;width:100%;max-width:440px;position:relative;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.modal h3{margin:0 0 8px}.modal hr{border:0;border-top:1px solid var(--line);margin:16px 0}
.modal .f{display:block;margin:10px 0}.modal .f span{display:block;font-size:13px;font-weight:600;margin-bottom:4px}
.modal input:not([type=file]){width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font:inherit}
.mrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.mclose{position:absolute;top:8px;right:10px;border:0;background:none;font-size:22px;color:var(--muted);cursor:pointer;line-height:1}
.merr{margin-top:10px;font-size:13.5px;color:var(--bad)}.merr.ok{color:var(--ok)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 40px 10px 14px;display:flex;gap:12px;align-items:center;box-shadow:0 6px 24px rgba(0,0,0,.18);z-index:60}
.toast .mclose{top:6px}
.lvlfilter{display:flex;align-items:center;gap:8px;padding:4px 10px 8px}
.lvlfilter select{flex:1;min-width:0}
.hardtag{font-size:10px;font-weight:700;letter-spacing:.04em;color:var(--bad);border:1px solid var(--bad);border-radius:4px;padding:0 4px;margin-left:2px;vertical-align:1px}
.chip.lvl-hard{background:var(--bad-bg);color:var(--bad);font-weight:600}
.chip.lvl-easy{background:var(--ok-bg);color:var(--ok)}
.levels{display:flex;gap:18px;flex-wrap:wrap}.levels label{display:flex;gap:6px;align-items:center;cursor:pointer}
.refbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;position:sticky;top:64px;z-index:3}
.refbar input[type=search]{flex:1;min-width:240px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font:inherit}
.refbar select{width:auto}
.refbar label{display:flex;gap:6px;align-items:center}
.acrgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:10px}
.acr{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.acr.mastered{border-left:4px solid var(--ok)}
.acr-h{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.acr-a{font-size:18px;font-weight:700;margin-right:4px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.acr-f{font-weight:600;margin:4px 0}
.acr-d{font-size:14px;color:var(--ink)}
.acr-t{font-size:13px;color:var(--accent);margin-top:6px}
mark{background:#ffe58a;color:#1d2330;border-radius:2px;padding:0 1px}
.portnum{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:15px}
.porttable td{font-size:14px}
.fc{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:34px 28px;text-align:center;min-height:240px;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.fc.flipped{cursor:default;text-align:left}
.fc.flipped .fc-front{text-align:center;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:14px}
.fc-big{font-size:34px;font-weight:700;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;margin:10px 0}
.fc-full{font-size:20px;font-weight:650;margin-bottom:8px}
.cc-body{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 22px;line-height:1.6}
.cc-body h3{font-size:15.5px;margin:18px 0 8px}.cc-body h3:first-child{margin-top:0}
.cc-body ul,.cc-body ol{padding-left:22px;margin:6px 0 10px}.cc-body li{margin:4px 0}
.cc-body ol.steps>li{margin:10px 0}
table.cc{width:100%;margin:8px 0 12px;border-radius:8px}
table.cc th{width:30%;text-transform:none;letter-spacing:0;font-size:13.5px;color:var(--ink);background:var(--chip);vertical-align:top}
table.cc td{font-size:14px}
table.pairs th{width:32%}
.ccbtns{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 4px}
.ccbtns .btn{padding:6px 12px;font-size:13.5px}
.ccdone{display:flex;gap:8px;align-items:center;font-weight:600;margin:0 auto}
.ccprog{padding:6px 10px 10px}.ccprog .bar{margin-top:6px}
ul.checklist li{margin:8px 0}
@media (max-width:820px){table.cc th{width:auto}}
@media (max-width:820px){.acrgrid{grid-template-columns:1fr}.refbar{position:static}}
@media (max-width:820px){
  .wrap{grid-template-columns:1fr}
  nav{display:none}
  .mobile-nav{display:block;margin-bottom:14px}
  main{padding:16px}
  header .sub{display:none}
  table,thead,tbody,tr,td,th{display:block}
  thead{display:none}
  tr{border-bottom:1px solid var(--line);padding:8px 0}
  td{border:0;padding:5px 12px}
  td[data-h]::before{content:attr(data-h);display:block;font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:.04em}
}
/* =====================================================================
   Redesign ("Calm exam room") — layered on top of the rules above.
   Presentation only: every class/id the scripts use is unchanged.
   ===================================================================== */
/* --- base --- */
body{font:16px/1.6 var(--font);-webkit-font-smoothing:antialiased;accent-color:var(--accent)}
main{padding:32px 40px 96px}
h2{margin:4px 0 16px;font-size:28px;line-height:36px;font-weight:600;letter-spacing:-.015em}
.muted{color:var(--muted);font-size:14px}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
button{font-family:inherit}
code,kbd,pre,.mono{font-family:var(--mono)}
kbd{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:var(--r-sm);font:500 11px/1 var(--mono);color:var(--muted);background:var(--panel)}
.overline{font-size:12px;line-height:16px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}}

/* --- header & mode tabs --- */
header{flex-wrap:wrap;gap:0 16px;padding:0 24px;background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
header h1{font-size:15px;font-weight:600;letter-spacing:-.01em;height:56px;display:flex;align-items:center;gap:10px}
header h1{margin-right:auto}header .score{margin-left:0}
header h1 .brand-mark{width:32px;height:32px;border-radius:var(--r-md);background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:0 0 32px}
header h1 .brand-sub{color:var(--muted);font-weight:500}
header .score{font-size:13px;font-variant-numeric:tabular-nums}
header .tabs{order:3;width:100%;display:flex;gap:4px;background:none;padding:0;border-radius:0;margin:0 -12px;overflow-x:auto;scrollbar-width:none}
header .tabs::-webkit-scrollbar{display:none}
header .tab{position:relative;height:44px;padding:0 12px;border-radius:0;background:none;color:var(--muted);font-size:14px;font-weight:500;box-shadow:none;transition:color var(--t-fast)}
header .tab:hover{color:var(--ink)}
header .tab.on{color:var(--ink);background:none;box-shadow:none}
header .tab.on::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:2px;border-radius:2px;background:var(--accent)}
.acct-btn{height:36px;padding:0 12px 0 10px;font-size:13px;font-weight:500;transition:background-color var(--t-fast)}
.acct-btn:hover{background:var(--chip)}
.auth-mode{--hdr:57px}
@media (max-width:700px){header{padding:0 16px}header h1 .brand-sub{display:none}header .tabs{margin:0 -8px}}

/* in-page segmented tabs (Acronyms sub-views) keep the tray style */
main .tabs{background:var(--chip);padding:3px;border-radius:var(--r-md)}
main .tab{height:34px;padding:0 14px;border-radius:var(--r-sm);font-size:14px;font-weight:500;transition:background-color var(--t-fast),color var(--t-fast)}
main .tab.on{background:var(--panel);color:var(--ink);box-shadow:var(--shadow-sm)}

/* --- layout --- */
.wrap{grid-template-columns:300px 1fr;min-height:calc(100vh - var(--hdr))}
nav{top:var(--hdr);max-height:calc(100vh - var(--hdr));padding:12px 8px}
.wrap.single main{max-width:960px}
body[data-page=mcq] .wrap.single main{max-width:760px}
body[data-page=exam] .wrap.single main{max-width:760px}
body.exam-live[data-page=exam] .wrap.single main{max-width:1160px}
body[data-page=ref] .wrap.single main{max-width:1200px}
body[data-page=account] .wrap.single main{max-width:1050px}

/* --- buttons --- */
.btn{height:40px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line-strong);background:var(--panel);color:var(--ink);border-radius:var(--r-md);font:500 14px/1 var(--font);box-shadow:var(--shadow-xs);cursor:pointer;white-space:nowrap;transition:background-color var(--t-fast),border-color var(--t-fast),transform var(--t-fast)}
.btn:hover{filter:none;background:var(--chip)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.sm{height:32px;padding:0 12px;font-size:13px}
.btn.ghost{background:transparent;box-shadow:none;border-color:transparent}
.btn.ghost:hover{background:var(--chip)}
.btn.danger{border-color:var(--bad);color:var(--bad-ink);background:var(--panel)}
.btn:disabled,.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn:disabled:hover{background:var(--panel)}.btn.primary:disabled:hover{background:var(--accent)}
.actions{gap:8px;margin:24px 0 12px}
.actions .btn{height:44px;padding:0 20px;font-size:15px}
.ccbtns .btn{height:32px;padding:0 12px;font-size:13px}
.linkbtn{color:var(--accent-soft-ink)}
@media (prefers-color-scheme:light){.linkbtn{color:var(--accent)}}

/* --- chips --- */
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 8px;border-radius:var(--r-sm);background:var(--chip);color:var(--muted);font-size:12px;line-height:1;font-weight:500;white-space:nowrap;vertical-align:middle}
.chip.lvl-hard{background:var(--warn-bg);color:var(--warn-ink);font-weight:600}
.chip.lvl-easy{background:var(--chip);color:var(--muted)}
.chip.lvl-medium{background:var(--chip);color:var(--muted)}
.chip.dom{background:var(--accent-soft);color:var(--accent-soft-ink)}
.chip.obj{background:var(--panel);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line-strong);font-variant-numeric:tabular-nums}
.chip.flagged,.flagged{background:var(--warn-bg);color:var(--warn-ink)}
.chip-custom{background:var(--accent-soft);color:var(--accent-soft-ink)}
.vis-pending{background:var(--warn-bg)!important;color:var(--warn-ink)!important}
.vis-public{background:var(--ok-bg);color:var(--ok-ink)}
.vis-rejected{background:var(--bad-bg);color:var(--bad-ink)}
.meta{gap:8px;margin-bottom:12px;align-items:center}

/* --- inputs --- */
select,input[type=text],input[type=search],input[type=email],input[type=password],input[type=date],input[type=number],input:not([type]){height:40px;padding:0 12px;border:1px solid var(--line-strong);border-radius:var(--r-md);background:var(--panel);color:var(--ink);font:400 14px var(--font);box-shadow:var(--shadow-xs);transition:border-color var(--t-fast),background-color var(--t-fast)}
textarea{border:1px solid var(--line-strong)!important;border-radius:var(--r-md)!important;font-family:var(--font)}
select:hover,input[type=text]:hover,input[type=search]:hover,input[type=email]:hover,input[type=password]:hover,input[type=date]:hover,input:not([type]):hover{border-color:var(--muted)}
select:focus-visible,input:focus-visible,textarea:focus-visible{border-color:var(--accent);outline:2px solid color-mix(in srgb,var(--accent) 25%,transparent);outline-offset:0}
select:invalid,select.empty{color:var(--subtle)}
select option{color:var(--ink)}
select.ok,input.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok-ink)}
select.bad,input.bad{border-color:var(--bad);background:var(--bad-bg);color:var(--bad-ink)}
.auth-card input,.modal input:not([type=file]),.f2 input[type=text],.f2 input[type=date],.f2 input[type=password]{height:40px;padding:0 12px;border-color:var(--line-strong)}
.editor textarea,.editor input[type=text]{border-color:var(--line-strong)}
/* the terminal's command line must stay borderless */
.term-in input,.term-in input:hover,.term-in input:focus-visible{height:auto;border:0;background:transparent;box-shadow:none;padding:0;outline:0;font:inherit;color:#e9f5e9}

/* --- cards & tables --- */
.card,.tile,.scenario,.acr,.cc-body{border-radius:var(--r-lg);border:1px solid var(--line);box-shadow:var(--shadow-xs)}
.card{padding:20px 24px;margin-bottom:16px}
.card h3{font-size:18px;line-height:28px;font-weight:600;margin:0 0 12px}
table{border-radius:var(--r-lg);box-shadow:var(--shadow-xs)}
th{font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--muted);background:var(--chip);padding:10px 20px}
td{padding:16px 20px}
.dom{padding:10px 12px;border-radius:var(--r-md);transition:background-color var(--t-fast),border-color var(--t-fast)}
label.dom:hover{background:var(--chip)}
.bar{height:8px;border-radius:999px;background:var(--line)}
.bar i{border-radius:999px}
.stat{font-size:13px;font-variant-numeric:tabular-nums}

/* --- answer options: letter badges, full-row selection, graded states --- */
.opts{gap:10px;counter-reset:opt}
.opt{position:relative;min-height:56px;align-items:center;gap:16px;padding:12px 16px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--panel);font-size:16px;line-height:1.45;transition:background-color var(--t-fast),border-color var(--t-fast),box-shadow var(--t-fast),opacity var(--t-med)}
.opt::before{counter-increment:opt;content:counter(opt,upper-alpha);flex:0 0 28px;height:28px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line-strong);font:600 13px var(--mono);color:var(--muted);background:var(--panel);transition:background-color var(--t-fast),border-color var(--t-fast),color var(--t-fast)}
.opt:has(input[type=checkbox])::before{border-radius:var(--r-sm)}
.opt input{position:absolute;opacity:0;width:1px;height:1px;margin:0;pointer-events:none}
.opt:hover{border-color:var(--line-strong);background:var(--chip)}
.opt:has(input:focus-visible){outline:2px solid var(--focus);outline-offset:2px}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent)}
.opt:has(input:checked)::before{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opts .opt.ok{border-color:var(--ok);background:var(--ok-bg);box-shadow:0 0 0 1px var(--ok)}
.opts .opt.ok::before{content:"✓";background:var(--ok);border-color:var(--ok);color:var(--on-fill);font-family:var(--font)}
.opts .opt.bad{border-color:var(--bad);background:var(--bad-bg);box-shadow:0 0 0 1px var(--bad)}
.opts .opt.bad::before{content:"✕";background:var(--bad);border-color:var(--bad);color:var(--on-fill);font-family:var(--font)}
.opts .opt.ok::after{content:"Correct answer";margin-left:auto;padding-left:12px;font-size:12px;font-weight:600;color:var(--ok-ink);white-space:nowrap}
.opts .opt.bad::after{content:"Your answer";margin-left:auto;padding-left:12px;font-size:12px;font-weight:600;color:var(--bad-ink);white-space:nowrap}
.opts:has(.opt.ok) .opt:not(.ok):not(.bad){opacity:.6}
.opts:has(.opt.ok) .opt{cursor:default}
.opts:has(.opt.ok) .opt:not(.ok):not(.bad):hover{background:var(--panel);border-color:var(--line)}
.qtext{font-size:22px;line-height:32px;font-weight:500;letter-spacing:-.005em;margin:8px 0 24px}
@media (max-width:700px){.qtext{font-size:19px;line-height:28px}.opts .opt.ok::after,.opts .opt.bad::after{display:none}}

/* --- feedback & explanations --- */
.feedback{margin-top:24px;padding:0;border:1px solid var(--line);border-left:1px solid var(--line);border-radius:var(--r-lg);background:var(--panel);box-shadow:var(--shadow-xs);overflow:hidden;animation:reveal .18s ease-out both}
.feedback.pass{border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.feedback.fail{border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.feedback .verdict{margin:0;padding:14px 20px;font-weight:600;font-size:15px;display:flex;gap:10px;align-items:baseline}
.feedback.pass .verdict{background:var(--ok-bg);color:var(--ok-ink)}
.feedback.fail .verdict{background:var(--bad-bg);color:var(--bad-ink)}
.feedback .fb-body{padding:14px 20px 18px;font-size:15px;line-height:1.65}
.feedback .fb-body p{margin:6px 0 0}
.result{border-radius:var(--r-md);padding:14px 16px}
.result.pass{background:var(--ok-bg);color:var(--ok-ink)}.result.fail{background:var(--bad-bg);color:var(--bad-ink)}
.explain{border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:var(--r-md);padding:14px 18px;font-size:15px}
.why{font-size:14px;color:var(--muted);line-height:1.55}
.correct{color:var(--ok-ink);font-size:13px}
.reveal tr:has(.bad) .correct{color:var(--bad-ink)}
.tip{font-size:13px;margin-top:40px;padding-top:16px}
.err{background:var(--bad-bg);color:var(--bad-ink);border-radius:var(--r-md)}
@keyframes reveal{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* --- MC session progress --- */
.sessbar{margin:0 0 16px}
.segs{display:flex;gap:3px;height:6px}
.segs i{flex:1;border-radius:999px;background:var(--line);transition:background-color var(--t-med)}
.segs i.cur{background:var(--accent)}.segs i.ok{background:var(--ok)}.segs i.bad{background:var(--bad)}.segs i.skip{background:var(--line-strong)}
.segs i.ans{background:color-mix(in srgb,var(--accent) 45%,var(--line))}
.segs.cont{display:block;background:var(--line);border-radius:999px;overflow:hidden}.segs.cont b{display:block;height:100%;background:var(--accent);border-radius:999px}
.sessmeta{display:flex;justify-content:space-between;gap:12px;margin-top:8px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.sessmeta .dot-ok,.sessmeta .dot-bad{display:inline-block;width:8px;height:8px;border-radius:50%;margin:0 4px 0 10px}
.sessmeta .dot-bad{background:var(--bad)}
.keys{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;margin-top:10px}
.keys span{display:inline-flex;gap:4px;align-items:center}

/* --- PBQ: sidebar --- */
nav .grp{position:sticky;top:-12px;background:var(--panel);z-index:1;font-size:12px;letter-spacing:.06em;padding:12px 8px 6px;display:flex;justify-content:space-between;gap:8px}
nav .grp .gp{font-weight:500;letter-spacing:0;text-transform:none;font-variant-numeric:tabular-nums}
nav button{padding:8px;border-radius:var(--r-md);font-size:14px;line-height:1.4;gap:10px;transition:background-color var(--t-fast)}
nav button:hover{background:var(--chip)}
nav button.active{background:var(--accent-soft);color:var(--accent-soft-ink);font-weight:500}
nav .num{flex:0 0 22px;height:22px;border-radius:50%;background:none;border:1px solid var(--line-strong);font:600 11px var(--mono);color:var(--muted)}
nav button.active .num{border-color:var(--accent);color:var(--accent)}
nav .num.pass{background:var(--ok);border-color:var(--ok);color:var(--on-fill)}
nav .num.fail{background:var(--bad-bg);border-color:var(--bad);color:var(--bad-ink)}
nav .tools button{color:var(--muted)}nav .tools button:hover{color:var(--ink)}
.hardtag{border:0;padding:0;margin-left:6px;font-size:11px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--warn-ink);vertical-align:0}
.lvlfilter{padding:4px 8px 8px}.lvlfilter select{height:32px;font-size:13px}

/* --- PBQ: task area --- */
.scenario{border-left:3px solid var(--accent);padding:16px 20px;font-size:16px;background:var(--panel)}
.scenario::before{content:"Scenario";display:block;font-size:12px;line-height:16px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
pre.log{font-family:var(--mono);font-size:12.5px;border-radius:var(--r-md)}
.term{font-family:var(--mono);border-radius:var(--r-lg)}
.task{font-size:18px;line-height:28px;font-weight:600;margin:24px 0 12px}
td.lbl{font-size:16px;font-weight:500}
.order,.multi{border-radius:var(--r-lg);box-shadow:var(--shadow-xs)}
.order li,.multi li{padding:12px 16px}
.order .pos{border-radius:var(--r-sm);font-family:var(--mono)}
.order .mv button{width:32px;height:32px;border-color:var(--line-strong);border-radius:var(--r-sm);transition:background-color var(--t-fast)}
.order .mv button:hover:not(:disabled){background:var(--chip)}
.actions.sticky{position:sticky;bottom:0;margin:24px -40px 0;padding:12px 40px;background:color-mix(in srgb,var(--panel) 94%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--line);z-index:2}
.answered{display:inline-flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.answered .pbar{width:120px;height:6px;border-radius:999px;background:var(--line);overflow:hidden}.answered .pbar b{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width var(--t-med)}
.timer{font-family:var(--mono);font-weight:500}
@media (max-width:820px){.actions.sticky{margin:24px -16px 0;padding:8px 16px;gap:6px}.actions.sticky .btn{height:36px;padding:0 12px;font-size:13px}.actions.sticky .timer{display:none}.answered{width:100%;font-size:12px}.answered .pbar{flex:1;max-width:none}}

/* --- Practice exam --- */
.exbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:12px 16px;margin-bottom:20px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-xs)}
.exbar .xprog{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.exbar .xprog .pbar{width:160px;height:6px;border-radius:999px;background:var(--line);overflow:hidden}.exbar .xprog .pbar b{display:block;height:100%;background:var(--accent);border-radius:999px}
.exbar .xflag{font-size:14px;color:var(--warn-ink)}
.exbar .btn{margin-left:auto}
.timer.big{margin:0;font:600 18px var(--mono);padding:4px 10px;border-radius:var(--r-md);background:var(--chip);color:var(--ink);transition:background-color var(--t-med),color var(--t-med)}
.timer.warn{background:var(--warn-bg);color:var(--warn-ink)}
.timer.crit{background:var(--bad-bg);color:var(--bad-ink)}
.btn.flag-on{background:var(--warn-bg);border-color:var(--warn);color:var(--warn-ink)}
.grid-nav{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;margin-top:0}

(() => {

  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const paras = t => String(t || "").split(/\n+/).filter(x => x.trim()).map(x => `<p>${esc(x)}</p>`).join("");
  for (const r of rows) {

      if (/^[1-5]\.[1-9]$/.test(d.obj || "") && +d.obj[0] === r.domain) base.obj = d.obj;
      if (r.kind === "mc") PBQ.addMC(r.domain, [Object.assign(base, { q: d.q, o: d.o, a: d.a, e: d.e })]);
      else if (r.kind === "pbq-match") PBQ.add([Object.assign(base, { type: "grid", title: d.title, scenario: paras(d.scenario), log: d.log || undefined, task: d.task,
        cols: [d.col || "Answer"], opts: [d.options], rows: (d.rows || []).map(x => ({ l: x.l, a: [x.a], w: x.w || "" })), explain: d.explain, time: 4 })]);
      else if (r.kind === "pbq-order") PBQ.add([Object.assign(base, { type: "order", title: d.title, scenario: paras(d.scenario), log: d.log || undefined, task: d.task,
        items: d.items, explain: d.explain, time: 3 })]);
    } catch (e) { /* skip a bad cached row rather than break the app */ }
  }
})();
